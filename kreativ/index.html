<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F5E3B">
<meta name="description" content="Malen und Farbenzauber mit Tuka.">
<meta property="og:title" content="Tukas Kreativ">
<meta property="og:description" content="Malen und Farbenzauber mit Tuka.">
<meta property="og:url" content="https://robertleitinger.github.io/tuka-lernwelt/kreativ/">
<meta property="og:image" content="https://robertleitinger.github.io/tuka-lernwelt/og.png">
<meta property="og:type" content="website">
<link rel="icon" href="../favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="../music.js" defer></script>
</head>
<body>
<title>Tukas Kreativ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
:root{
  --jungle:#1F5E3B; --deep:#16452B; --leaf:#3FA34D; --sand:#F6EBD5; --paper:#FFFBF1;
  --sun:#F28C28; --lagoon:#1BA6A6; --ink:#1C2B24; --muted:#4B5C52; --line:#E6D6B3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--ink);font:17px/1.45 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.top{background:var(--jungle);color:#fff;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;overflow:hidden}
.top::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-40px;height:80px;background:var(--sand);border-radius:50% 50% 0 0}
.wrap{max-width:560px;margin:0 auto}
.musicrow{display:flex;justify-content:flex-end;margin:-12px 0 8px}
.hello{display:flex;gap:16px;align-items:center}
.hello img{width:84px;height:84px;border-radius:22px;flex:none;box-shadow:0 6px 0 rgba(0,0,0,.18)}
h1{font-family:Fredoka,"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:600;font-size:clamp(28px,8vw,38px);line-height:1.05;margin:0;text-wrap:balance}
.top p{margin:10px 0 0;font-size:18px;color:#E4F2E7}
main{padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin-top:-36px;position:relative;z-index:1}
.cards{display:grid;gap:16px}
a.card{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;text-decoration:none;color:inherit;background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 5px 0 var(--line);transition:transform .12s ease, box-shadow .12s ease;min-height:44px}
a.card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
a.card:focus-visible{outline:3px solid var(--lagoon);outline-offset:3px}
.badge{width:64px;height:64px;border-radius:18px;display:grid;place-items:center}
.badge svg{width:38px;height:38px}
.b1{background:#DDEFD9}.b2{background:#FFE6CC}.b3{background:#DCEFEF}
.card h2{font-family:Fredoka,"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:600;font-size:21px;line-height:1.15;margin:0 0 4px}
.card p{margin:0;color:var(--muted);font-size:16px}
.meta{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.pill{font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sand);color:var(--deep)}
.go{font-family:Fredoka,"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:600;color:#fff;background:var(--sun);border-radius:999px;padding:3px 12px;font-size:15px}
.fach{font-family:Fredoka,"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:600;font-size:22px;margin:26px 4px 12px;color:var(--deep)}
.fach:first-child{margin-top:8px}
.tip{margin-top:26px;background:#fff8;border:2px dashed var(--line);border-radius:18px;padding:14px 16px;font-size:16px;color:var(--muted)}
.tip b{color:var(--ink)}
.note{margin:18px 4px 0;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){a.card{transition:none}}
</style>

<style>
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:14px}
a.subj{display:grid;justify-items:center;align-content:center;text-align:center;gap:10px;padding:20px 10px 18px;background:var(--paper);border:2px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--line);text-decoration:none;color:inherit;min-height:168px;transition:transform .12s ease, box-shadow .12s ease}
a.subj:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
a.subj:focus-visible{outline:3px solid var(--lagoon);outline-offset:3px}
a.subj .badge{width:80px;height:80px;border-radius:22px}
a.subj .badge svg{width:48px;height:48px}
a.subj h2{font-family:Fredoka,"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:600;font-size:21px;line-height:1.1;margin:0}
a.subj small{font-size:15px;color:var(--muted);line-height:1.25}
.b4{background:#FBE3CF}
.backrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-12px 0 8px}
a.backpill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 16px 4px 12px;border-radius:999px;background:#F6EBD5;color:#16452B;text-decoration:none;font:600 16px/1 Fredoka,"Atkinson Hyperlegible",system-ui,sans-serif}
a.backpill:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
</style>

<header class="top">
  <div class="wrap">
    <div class="musicrow backrow"><a class="backpill" href="../">← Übersicht</a><style>button.tl-music{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 14px 4px 10px;border-radius:999px;border:2px solid rgba(246,235,213,.55);background:transparent;color:#F6EBD5;font:600 15px/1 Fredoka,"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer;flex:none;-webkit-tap-highlight-color:transparent}button.tl-music.is-on{background:#F28C28;border-color:#F28C28;color:#1C2B24}button.tl-music:focus-visible{outline:3px solid #1BA6A6;outline-offset:2px}button.tl-music svg{display:block;flex:none}</style><button type="button" class="tl-music" aria-pressed="false" aria-label="Musik einschalten"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 18.5a3 3 0 1 1-2-2.83V5.5l11-2.5v12a3 3 0 1 1-2-2.83V7.6L9 9.2z" fill="currentColor"/></svg><span class="tl-music-label">Musik aus</span></button></div>
    <div class="hello">
      <img src="../tuka.svg" alt="Tuka, die Tukan-Dame" width="84" height="84">
      <div>
        <h1>Kreativ</h1>
        <p>Malen und Farben schauen.</p>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="cards">
      <a class="card" href="farben/">
        <span class="badge b4" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="15" cy="16" r="10" fill="#E5484D" opacity=".85"/><circle cx="25" cy="16" r="10" fill="#1BA6A6" opacity=".85"/><circle cx="20" cy="25" r="10" fill="#F2C12E" opacity=".85"/></svg></span>
        <span>
          <h2>Farbenzauber</h2>
          <p>Bunte Farben fließen langsam ineinander. Tipp auf den Bildschirm und es entstehen neue Kleckse.</p>
          <span class="meta"><span class="pill">Zum Abschalten</span><span class="go">Anschauen</span></span>
        </span>
      </a>
      <a class="card" href="malen/">
        <span class="badge b2" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M8 32c6-1 8-4 9-7l12-14a3 3 0 0 1 4 4L19 28c-3 1-6 3-11 4z" fill="#F28C28" stroke="#1C2B24" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 32c2-3 3-6 6-7" fill="none" stroke="#1C2B24" stroke-width="1.6"/></svg></span>
        <span>
          <h2>Malen</h2>
          <p>Male mit vielen Farben, dem Regenbogen-Pinsel und dem Radierer.</p>
          <span class="meta"><span class="pill">Bild speichern</span><span class="go">Malen</span></span>
        </span>
      </a>
    </div>
  </div>
</main>

</body>
</html>
