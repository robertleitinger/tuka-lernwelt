<script>
'use strict';
const TUKA = '../../tuka.svg';
const SVGNS = 'http://www.w3.org/2000/svg';

/* ---------- Hilfen ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) {
    const v = attrs[k]; if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
function rc(el, ...kids) { el.replaceChildren(...kids.flat().filter(k => k !== null && k !== undefined && k !== false)); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
const view = document.getElementById('view');
function screen(...kids) { rc(view, ...kids); window.scrollTo(0, 0); }
const PRAISE = ['Super!', 'Richtig!', 'Genau!', 'Stark gemacht!', 'Bravo!', 'Jawohl!'];
const SOFT = ['Kein Problem.', 'Guter Versuch!', 'Das merkst du dir jetzt.'];
/* Zahlen in Dreierpäckchen: 4 702 315 */
function fmt(n) { const s = String(n); return s.length <= 4 ? s : s.replace(/\B(?=(\d{3})+(?!\d))/g, ' '); } // wie im Buch: vierstellig ohne Lücke
/* Optionen: die richtige plus bis zu k eindeutige falsche */
function opts(ok, cands, k) {
  const out = [];
  for (const c of cands) { if (c === null || c === undefined || Number.isNaN(c)) continue; if (c !== ok && !out.includes(c) && (typeof c !== 'number' || c > 0)) out.push(c); if (out.length === k) break; }
  return [ok, ...out];
}
function digitsOf(n) { return String(n).split('').reverse().map(Number); }
function fromDigits(d) { let n = 0; for (let i = d.length - 1; i >= 0; i--) n = n * 10 + d[i]; return n; }
/* Typische Fehler beim schriftlichen Rechnen */
function addNoCarry(nums) { const L = Math.max(...nums.map(n => String(n).length)); const d = []; for (let i = 0; i < L; i++) d.push(nums.reduce((s, n) => s + (digitsOf(n)[i] || 0), 0) % 10); return fromDigits(d); }
function subNoBorrow(a, b) { const A = digitsOf(a), B = digitsOf(b), d = []; for (let i = 0; i < A.length; i++) d.push((A[i] - (B[i] || 0) + 10) % 10); return fromDigits(d); } // Übertrag vergessen
function subSmallFromBig(a, b) { const A = digitsOf(a), B = digitsOf(b), d = []; for (let i = 0; i < A.length; i++) d.push(Math.abs(A[i] - (B[i] || 0))); return fromDigits(d); } // kleine von großer Ziffer
function hasCarryAdd(nums) { const L = Math.max(...nums.map(n => String(n).length)); for (let i = 0; i < L; i++) if (nums.reduce((s, n) => s + (digitsOf(n)[i] || 0), 0) >= 10) return true; return false; }
function hasBorrow(a, b) { const A = digitsOf(a), B = digitsOf(b); return B.some((x, i) => x > A[i]); }
function rndN(len) { return ri(10 ** (len - 1), 10 ** len - 1); }
/* Schriftliche Rechnung untereinander (wie im Heft) */
function stackHTML(nums, op, res) {
  const L = Math.max(...nums.map(n => String(n).length), res === undefined ? 0 : String(res).length);
  const cell = c => '<td>' + c + '</td>';
  const row = (n, sign, cls) => { const s = String(n).padStart(L, ' '); return '<tr' + (cls ? ' class="' + cls + '"' : '') + '>' + cell(sign || '') + [...s].map(c => cell(c === ' ' ? '' : c)).join('') + '</tr>'; };
  let out = '<table class="stack">';
  nums.forEach((n, i) => { out += row(n, i === nums.length - 1 ? op : '', i === nums.length - 1 ? 'last' : ''); });
  if (res !== undefined) out += row(res, '', 'res');
  return out + '</table>';
}
/* Rechenpyramide: unten a, b, c; Mitte a+b, b+c; oben Summe */
function pyraHTML(cells, target) {
  const box = (v, i) => '<span class="pz' + (i === target ? ' tgt' : '') + '">' + (i === target ? '?' : (v === null ? '' : fmt(v))) + '</span>';
  return '<div class="pyra"><div>' + box(cells[5], 5) + '</div><div>' + box(cells[3], 3) + box(cells[4], 4) + '</div><div>' + box(cells[0], 0) + box(cells[1], 1) + box(cells[2], 2) + '</div></div>';
}

/* ---------- Aufgaben ----------
   Jede Aufgabe liefert: label, text (oder html), big, fig, opts, ok, yn, hint, sol, why */
const GAMES = {
  kopf: { title: 'Kopfrechnen', icon: '🧠', bg: '#DCEFEF', text: 'Plus und minus im Kopf, Lücken und Fachbegriffe.', types: ['kopf', 'luecke', 'begriff', 'tukaK'] },
  schrift: { title: 'Schriftlich rechnen', icon: '✍️', bg: '#F3E7C9', text: 'Untereinander rechnen, Überschlag und Probe.', types: ['schrift', 'ueber', 'probe', 'mal', 'tukaS'] },
  terme: { title: 'Terme und Klammern', icon: '🧩', bg: '#DDEFD9', text: 'Klammern, Rechenpyramide und Textaufgaben.', types: ['klammer', 'wort', 'pyra', 'text', 'vorteil', 'tukaT'] }
};
const TYPE_NAME = { kopf: 'Kopfrechnen', luecke: 'Fehlende Zahl', begriff: 'Fachbegriffe', tukaK: 'Tukas Kopfrechnung', schrift: 'Schriftlich rechnen', ueber: 'Überschlag', probe: 'Probe', mal: 'Mal und durch', tukaS: 'Tukas Rechnung', klammer: 'Klammern', wort: 'Wortform', pyra: 'Rechenpyramide', text: 'Textaufgabe', vorteil: 'Geschickt rechnen', tukaT: 'Tukas Term' };
const HINTS = {
  kopf: 'Zerlege eine Zahl: 94 + 28 = 94 + 20 + 8.',
  luecke: 'Rechne mit der Umkehraufgabe. Aus plus wird minus, aus minus wird plus.',
  begriff: 'Plus: Summand + Summand = Summe. Minus: Minuend - Subtrahend = Differenz.',
  schrift: 'Fang bei den Einern an. Überträge nicht vergessen!',
  ueber: 'Runde zuerst jede Zahl. Dann rechnest du mit den runden Zahlen.',
  probe: 'Die Probe ist die Gegenrechnung: Aus minus wird plus, aus plus wird minus.',
  mal: 'Rechne in Schritten. Die Probe hilft: Mal und durch gehören zusammen.',
  klammer: 'Zuerst rechnest du, was in der Klammer steht.',
  wort: 'Was zuerst gerechnet wird, kommt in die Klammer.',
  pyra: 'Zwei Nachbarn zusammen ergeben die Zahl darüber.',
  text: 'Schreib alles auf, was gekauft oder bezahlt wird. Dann rechnen.',
  vorteil: 'Such Zahlen, die zusammen eine runde Zahl ergeben.'
};
const PRICES = ['ein Buch', 'einen Schal', 'einen Rucksack', 'ein Spiel', 'einen Pullover', 'ein Federpennal'];

function gen(type) {
  const it = { type, hint: HINTS[type] || '', why: '' };
  if (type === 'kopf' || type === 'tukaK') {
    const v = pick(['add', 'add', 'sub', 'sub', 'tausend', 'fast100']);
    let a, b, op, ok, why;
    if (v === 'add') { do { a = ri(25, 95); b = ri(12, 49); } while ((a % 10) + (b % 10) < 10); op = '+'; ok = a + b; why = a + ' + ' + (b - b % 10) + ' = ' + (a + b - b % 10) + ', dann + ' + (b % 10) + ' = ' + ok + '.'; }
    else if (v === 'sub') { do { a = ri(120, 480); b = ri(13, 69); } while ((a % 10) >= (b % 10)); op = '-'; ok = a - b; why = a + ' - ' + (b - b % 10) + ' = ' + (a - b + b % 10) + ', dann - ' + (b % 10) + ' = ' + ok + '.'; }
    else if (v === 'tausend') { a = 1000; b = ri(101, 899); op = '-'; ok = a - b; why = 'Ergänze ' + b + ' auf 1000: ' + b + ' + ' + ok + ' = 1000.'; }
    else { a = ri(120, 690); const k = pick([98, 99, 97]); const plus = Math.random() < 0.5; b = k; op = plus ? '+' : '-'; ok = plus ? a + b : a - b; why = plus ? a + ' + 100 = ' + (a + 100) + ', dann - ' + (100 - k) + ' = ' + ok + '.' : a + ' - 100 = ' + (a - 100) + ', dann + ' + (100 - k) + ' = ' + ok + '.'; }
    const nc = op === '+' ? addNoCarry([a, b]) : subNoBorrow(a, b);
    const task = fmt(a) + ' ' + op + ' ' + fmt(b);
    if (type === 'kopf') {
      Object.assign(it, { label: 'Rechne im Kopf.', text: task + ' = ?', big: true, opts: opts(ok, shuffle([nc, ok + 10, ok - 10, ok + 1, ok - 1, ok + 2]), 3), ok, sol: task + ' = ' + fmt(ok) + '.', why });
    } else {
      const right = Math.random() < 0.45; const wrongV = pick([ok + 10, ok - 10, ok + 2, ok - 2, nc].filter(x => x !== ok && x >= 0));
      Object.assign(it, { yn: true, label: 'Tuka hat im Kopf gerechnet. Stimmt das?', text: 'Tuka sagt: ' + task + ' = ' + fmt(right ? ok : wrongV), ok: right ? 'Stimmt' : 'Stimmt nicht',
        sol: right ? 'Das stimmt.' : 'Das stimmt nicht. Richtig ist ' + fmt(ok) + '.', why });
    }

/* ---------- Fortschritt (nur in diesem Browser) ---------- */
const KEY = 'tuka-mathe-k3-v1';
let store = (function () { try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.lv) return v; } catch (e) {} return { lv: {} }; })();
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function lv(id) { return store.lv[id] || (store.lv[id] = { c: 0, m: 0 }); }
function levelUp(id, ok) { const l = lv(id); if (ok) { l.c = Math.min(4, l.c + 1); l.m = Math.max(0, l.m - 1); } else { l.c = Math.max(0, l.c - 1); l.m = Math.min(3, l.m + 1); } save(); }
const ALL_TYPES = Object.values(GAMES).flatMap(g => g.types);
function weightedPick(types, last) {
  const w = types.map(id => { const l = lv(id); return (id === last ? 0.3 : 1) * (1 + (4 - l.c) * 1.2 + l.m * 1.5); });
  let t = w.reduce((a, b) => a + b, 0), r = Math.random() * t;
  for (let i = 0; i < types.length; i++) { r -= w[i]; if (r <= 0) return types[i]; }
  return types[types.length - 1];
}

function startRound(mode) {

  if (mode === 'test') { Object.values(GAMES).forEach(g => addN(g.types, 4)); q.splice(0, q.length, ...shuffle(q)); }
  else addN(GAMES[mode].types, 10);
  nextQuestion({ mode, q, i: 0, done: 0, total: q.length, first: 0, missed: [] });
}

  const hintBox = h('div', { class: 'hintbox', hidden: true });
  const fb = h('div', { class: 'fb', hidden: true });
  const hintBtn = h('button', { type: 'button', onclick: () => doHint() }, '💡 Tipp');
  const skipBtn = h('button', { type: 'button', onclick: () => doSkip() }, 'Weiß ich nicht');
  const helpers = h('div', { class: 'helpers' });
  if (!test && it.hint) helpers.append(hintBtn);
  helpers.append(skipBtn);
  const top = h('div', { class: 'qtop' },
    h('button', { type: 'button', class: 'back', 'aria-label': 'Beenden', onclick: homeScreen }, '✕'),
    h('span', { class: 'bar' }, bar), h('span', { class: 'count' }, (round.done + 1) + '/' + round.total), stars);

  const qtext = it.html ? h('div', { class: 'qsym', html: it.html }) : h('div', { class: it.big ? 'qsym' : (it.yn ? 'qtext stmt' : 'qtext sent') }, it.text);
  const qbox = h('div', null, h('div', { class: 'qlabel' }, it.label), qtext);
  const fig = it.fig ? h('div', { class: 'fig' }, it.fig) : null;
  const optsEl = h('div', { class: it.yn ? 'yn' : 'opts' });
  const okKey = String(it.ok);
  (it.fixed ? it.opts : shuffle(it.opts)).forEach(v => {
    const b = h('button', { type: 'button', class: 'opt' + (it.sym ? ' sym' : ''), onclick: () => pickIt(v, b) }, it.optLabel(v)); b.dataset.v = String(v); optsEl.append(b);
  });
  rc(answers, optsEl);

  function requeue() { if (qq.again || test) return; round.q.splice(Math.min(round.q.length, round.i + 3), 0, { type: qq.type, again: 1 }); round.total++; }
  function lockAll(mark) { optsEl.querySelectorAll('button').forEach(x => { x.disabled = true; if (mark && x.dataset.v === okKey) x.classList.add('ok'); }); }
  function finish(ok, title, lines) {
    if (answered) return; answered = true;
    const counted = ok && firstTry && !hintUsed;
    levelUp(qq.type, counted);
    if (counted) round.first++; else round.missed.push({ type: qq.type, sol: it.sol });
    if (!ok) requeue();
    round.done++;
    bar.style.width = Math.round(round.done / round.total * 100) + '%';
    stars.textContent = '⭐ ' + round.first;
    helpers.hidden = true; hintBox.hidden = true;
    fb.className = 'fb ' + (ok ? 'good' : 'soft');
    const nextBtn = h('button', { type: 'button', class: 'next', onclick: () => { round.i++; nextQuestion(round); } }, round.i + 1 >= round.q.length ? 'Fertig' : 'Weiter');
    rc(fb, h('div', { class: 'ft' }, title), ...lines.filter(Boolean).map(t => h('div', { class: 'fx' }, t)), nextBtn);
    fb.hidden = false;
    setTimeout(() => { try { nextBtn.focus({ preventScroll: true }); fb.scrollIntoView({ block: 'nearest' }); } catch (e) {} }, 60);
  }
  function pickIt(v, b) {
    if (answered) return;
    if (String(v) === okKey) { b.classList.add('ok'); lockAll(false); finish(true, pick(PRAISE), [it.yn ? it.sol + ' ' + it.why : it.sol, it.yn ? '' : it.why]); return; }
    firstTry = false; wrong++; b.classList.add('bad'); b.disabled = true;
    if (wrong >= 2 || it.yn) { lockAll(true); finish(false, pick(SOFT), [it.sol, it.why, (!test && !qq.again) ? 'So eine Aufgabe kommt gleich nochmal.' : '']); return; }
    hintBox.hidden = false; rc(hintBox, 'Noch nicht. ' + (it.hint && !test ? '💡 ' + it.hint : 'Versuch es nochmal!')); if (!test) { hintUsed = true; hintBtn.disabled = true; }
  }
  function doHint() { if (answered) return; hintUsed = true; hintBtn.disabled = true; hintBox.hidden = false; rc(hintBox, '💡 ' + it.hint); }
  function doSkip() { if (answered) return; firstTry = false; lockAll(true); finish(false, 'Kein Problem!', [it.sol, it.why, (!test && !qq.again) ? 'So eine Aufgabe kommt gleich nochmal.' : '']); }

  screen(top, h('div', { class: 'qcard' }, h('img', { src: TUKA, alt: '' }), qbox), fig, answers, hintBox, fb, helpers);
}

function endScreen(round) {
  const share = round.first / round.total;
  const title = share >= 1 ? 'Alles richtig!' : share >= 0.8 ? 'Wow, fast alles!' : share >= 0.5 ? 'Geschafft, super!' : 'Geschafft!';
  const starsN = share >= 0.8 ? 3 : share >= 0.5 ? 2 : 1;
  screen(h('div', { class: 'end' },
    h('img', { src: TUKA, alt: 'Tuka freut sich' }),
    h('h2', null, title),
    h('div', { class: 'starrow', 'aria-label': starsN + ' Sterne' }, '⭐'.repeat(starsN)),
    h('p', { style: 'margin:0;font-size:18px' }, round.mode === 'test' ? 'Du hast ' + round.first + ' von ' + round.total + ' Punkten.' : 'Du hast ' + round.first + ' von ' + round.total + ' gleich beim ersten Mal gewusst.'),
    round.missed.length ? h('div', { class: 'again' }, h('h3', { style: 'font-size:19px;margin-bottom:8px' }, 'Das übst du nochmal:'),
      h('div', { class: 'list' }, ...round.missed.map(m => h('div', { class: 'row' }, h('span', null, TYPE_NAME[m.type]), h('span', null, m.sol))))) : h('p', { class: 'muted', style: 'margin:0' }, 'Tuka ist stolz auf dich!'),
    h('div', { class: 'btns' },
      h('button', { type: 'button', class: 'next', onclick: () => startRound(round.mode) }, 'Nochmal'),
      h('button', { type: 'button', class: 'ghost', onclick: homeScreen }, 'Zur Übersicht'))));
}

homeScreen();
</script>
</body>
</html>
