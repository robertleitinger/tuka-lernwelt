<style>
:root{
  --bg:#F6EBD5; --surface:#FFFBF1; --surface-2:#EFE0C1; --ink:#1C2B24; --ink-soft:#4A5A51;
  --green:#1F5E3B; --deep:#16452B; --leaf:#3FA34D; --orange:#F28C28; --teal:#1BA6A6;
  --btn:#1F5E3B; --btn-ink:#FFFFFF; --line:rgba(28,43,36,.16); --track:#E7D3AC;

  --f-text:"Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#16452B}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--f-text);min-height:100vh}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}

nav.tl-nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:10px;background:#16452B;color:#F6EBD5;box-shadow:0 2px 0 rgba(0,0,0,.18);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));min-height:52px;font-family:var(--f-disp)}
nav.tl-nav a.tl-home{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:4px 14px 4px 5px;border-radius:999px;background:#F6EBD5;color:#16452B;text-decoration:none;font-weight:600;font-size:16px;line-height:1;white-space:nowrap;flex:none;margin:4px 0}
nav.tl-nav a.tl-home img{width:34px;height:34px;border-radius:50%;display:block}
nav.tl-nav .tl-title{font-size:16px;font-weight:500;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
button.tl-music{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 14px 4px 10px;border-radius:999px;border:2px solid rgba(246,235,213,.55);background:transparent;color:#F6EBD5;font:600 15px/1 var(--f-disp);cursor:pointer;flex:none;-webkit-tap-highlight-color:transparent}
button.tl-music.is-on{background:#F28C28;border-color:#F28C28;color:#1C2B24}
button.tl-music svg{display:block;flex:none}
@media (max-width:430px){nav.tl-nav .tl-title{display:none}}

.app{max-width:560px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-left,0px)) 40px max(14px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
.muted{color:var(--ink-soft)}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

.hero{display:flex;gap:14px;align-items:center;margin:4px 0 12px}
.hero img{width:72px;height:72px;border-radius:20px;flex:none;box-shadow:0 5px 0 rgba(0,0,0,.14)}
.hero h1{font-size:clamp(26px,7vw,34px)}
.hero p{margin:4px 0 0;color:var(--ink-soft)}
.sec{font-size:20px;margin:18px 2px 10px}
.units{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ubtn{display:grid;gap:6px;text-align:left;min-height:54px;padding:9px 12px;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;-webkit-tap-highlight-color:transparent}
.ubtn b{font-family:var(--f-disp);font-weight:600;font-size:17px}
.ubtn small{color:var(--ink-soft);font-size:14px;line-height:1.2}
.ubtn[aria-pressed="true"]{border-color:var(--orange);background:var(--hint-bg);box-shadow:0 3px 0 var(--orange)}
.bar{height:7px;border-radius:999px;background:var(--track);overflow:hidden;display:block}
.bar > i{display:block;height:100%;background:var(--leaf);border-radius:999px;width:0;transition:width .4s ease}
.modes{display:grid;gap:12px}
.mode{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:20px;border:2px solid var(--line);background:var(--surface);box-shadow:0 5px 0 var(--line);cursor:pointer;min-height:76px;-webkit-tap-highlight-color:transparent}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.mode .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px}
.mode h3{font-size:19px}
.mode p{margin:2px 0 0;color:var(--ink-soft);font-size:15px}
.note{margin:18px 4px 0;font-size:14px;color:var(--ink-soft)}

.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qtop .bar{flex:1;height:10px}
.qtop .count{font:600 15px var(--f-disp);color:var(--ink-soft);white-space:nowrap}
.qtop .stars{font:600 16px var(--f-disp);white-space:nowrap}
.back{min-width:44px;min-height:44px;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font:600 15px var(--f-disp);cursor:pointer}
.qcard{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.qcard img{width:52px;height:52px;border-radius:14px}
.qlabel{font-size:15px;color:var(--ink-soft)}
.qtext{font:600 26px/1.2 var(--f-disp);overflow-wrap:anywhere}
.qtext.sent{font-size:22px}
.qsub{font-size:15px;color:var(--ink-soft);margin-top:2px}
.write{display:flex;gap:8px;margin-top:14px}
.write input{flex:1;min-width:0;min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:8px 14px;font:600 21px var(--f-disp);color:var(--ink)}
.write input:focus{outline:3px solid var(--teal);outline-offset:1px}
.write button{min-height:56px;padding:0 16px;border-radius:14px;border:0;background:var(--btn);color:var(--btn-ink);font:600 17px var(--f-disp);cursor:pointer}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
.opt{min-height:56px;padding:8px 12px;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font:600 20px/1.15 var(--f-disp);cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt.ok{background:var(--good-bg);border-color:var(--leaf);color:var(--good-ink)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.helpers{display:flex;gap:10px;margin-top:12px}
.helpers button{flex:1;min-height:46px;border-radius:14px;border:2px dashed var(--line);background:transparent;font:600 16px var(--f-disp);cursor:pointer;color:var(--ink-soft)}
.hintbox{margin-top:10px;background:var(--hint-bg);color:var(--hint-ink);border-radius:14px;padding:10px 12px;font-size:17px}
.hintbox .pat{font:600 22px var(--f-disp);letter-spacing:2px}
.fb{margin-top:12px;border-radius:18px;padding:12px 14px;display:grid;gap:10px}
.fb.good{background:var(--good-bg);color:var(--good-ink)}
.fb.soft{background:var(--hint-bg);color:var(--hint-ink)}
.fb .ft{font:600 20px/1.2 var(--f-disp)}
.fb .fx{font-size:17px}
.fb .word{font:600 24px var(--f-disp)}
.say{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 14px;border-radius:999px;border:2px solid currentColor;background:transparent;font:600 15px var(--f-disp);cursor:pointer;color:inherit;justify-self:start}
.next{min-height:52px;border-radius:16px;border:0;background:var(--btn);color:var(--btn-ink);font:600 19px var(--f-disp);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.next:active{transform:translateY(2px)}

.end{text-align:center;display:grid;gap:12px;justify-items:center;padding-top:10px}
.end img{width:110px;height:110px;border-radius:28px}
.end h2{font-size:30px}
.end .starrow{font-size:30px;letter-spacing:4px}
.end .again{width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px}
.list{display:grid;gap:6px}
.list .row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.list .row span:first-child{font-weight:700}
.list .row span:last-child{color:var(--green);font-family:var(--f-disp);font-weight:600;text-align:right}
.end .btns{display:grid;gap:10px;width:100%}
.ghost{min-height:50px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font:600 17px var(--f-disp);cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    ["I've got a parrot. I've = I ___", 'have', ['am', 'has'], "I've got = I have got"],
    ['Captain Hook ___ a hook.', 'has got', ['have got', 'is got'], 'Eine Person: has got'],
    ['one tooth, two ___', 'teeth', ['tooths', 'teeths'], 'Ausnahme: tooth, teeth'],
    ['one foot, two ___', 'feet', ['foots', 'feets'], 'Ausnahme: foot, feet'],
    ['The pirate is very ___. He has got strong arms.', 'strong', ['tired', 'short'], 'strong = stark']
  ]}
];
const WORDS = [], BYID = {};
UNITS.forEach(u => u.words.forEach((w, i) => { const o = { id: u.id + 'w' + i, unit: u.id, de: w[0], en: w[1].split('|'), note: w[2] || '' }; WORDS.push(o); BYID[o.id] = o; }));
const SENTS = [];
UNITS.forEach(u => u.sentences.forEach((s, i) => SENTS.push({ id: u.id + 's' + i, unit: u.id, text: s[0], ok: s[1], wrong: s[2], rule: s[3] })));

/* ---------- Hilfen ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) {
    const v = attrs[k]; if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
function rc(el, ...kids) { el.replaceChildren(...kids.flat().filter(k => k !== null && k !== undefined && k !== false)); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
const view = document.getElementById('view');
function screen(...kids) { rc(view, ...kids); window.scrollTo(0, 0); }
const PRAISE = ['Super!', 'Richtig!', 'Genau!', 'Stark gemacht!', 'Bravo!', 'Well done!', 'Great!'];
const SOFT = ['Kein Problem.', 'Guter Versuch!', 'Das merkst du dir jetzt.'];

/* ---------- Fortschritt (nur in diesem Browser) ---------- */
const KEY = 'tuka-english-v1';
let store = (function () {
  try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.lv) return v; } catch (e) {}
  return { lv: {}, unit: 'u3' };
})();
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function lv(id) { return store.lv[id] || (store.lv[id] = { c: 0, m: 0 }); }
function isSafe(id) { return lv(id).c >= 2; }
function idsOf(unit, list) { return list.filter(x => unit === 'all' || x.unit === unit).map(x => x.id); }
function unitProgress(unit) { const ids = idsOf(unit, WORDS); return { safe: ids.filter(isSafe).length, total: ids.length }; }
function levelUp(id, ok) { const l = lv(id); if (ok) { l.c = Math.min(3, l.c + 1); l.m = Math.max(0, l.m - 1); } else { l.c = Math.max(0, l.c - 1); l.m = Math.min(3, l.m + 1); } save(); }

/* ---------- Schreibweise prüfen ---------- */
function norm(s) {
  return s.toLowerCase().replace(/[’‘`´]/g, "'").replace(/[.!?,…]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function core(s) {
  let t = norm(s);
  if (t !== 'to') t = t.replace(/^to /, '');
  t = t.replace(/^(a|an|the) /, '');
  return t;
}
function dist(a, b) {
  const m = a.length, n = b.length; const d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
function check(w, input) {
  const x = core(input); if (!x) return 'empty';
  const goals = w.en.map(core);
  if (goals.includes(x)) return 'ok';
  const flat = s => s.replace(/[\s-]/g, '');
  if (goals.some(g => flat(g) === flat(x))) return 'close';
  // anderes Wort erkannt? Zuerst dieselbe Unit, dann alle Units
  const isOther = o => o.id !== w.id && o.en.map(core).includes(x) && !o.en.some(e => w.en.includes(e));
  const other = WORDS.find(o => o.unit === w.unit && isOther(o)) || WORDS.find(isOther);
  if (other) return { other };
  if (goals.some(g => g.length >= 4 && dist(g, x) === 1)) return 'close';
  return 'wrong';
}
function pattern(word) { return word.split(' ').map(p => [...p].map((ch, i) => i === 0 || ch === '-' || ch === "'" ? ch : '_').join(' ')).join('   '); }

/* Vorlesen (falls das Handy eine englische Stimme hat) */
const canSpeak = 'speechSynthesis' in window;
function say(text) {
  if (!canSpeak) return;
  try { const u = new SpeechSynthesisUtterance(text); u.lang = 'en-GB'; u.rate = 0.85; const v = speechSynthesis.getVoices().find(v => /^en[-_]GB/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang)); if (v) u.voice = v; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}

/* ---------- Startseite ---------- */
function homeScreen() {
  const unit = store.unit || 'u3';
  const ubtns = [];
  const unitsEl = h('div', { class: 'units', role: 'group', 'aria-label': 'Unit wählen' });
  function uButton(id, name, sub) {
    const p = unitProgress(id);
    const b = h('button', { type: 'button', class: 'ubtn', 'aria-pressed': String(id === unit), onclick: () => select(id) },
      h('b', null, name), h('small', null, sub), h('span', { class: 'bar' }, h('i', { style: 'width:' + Math.round(p.safe / p.total * 100) + '%' })));
    b.dataset.u = id; ubtns.push(b); return b;
  }
  UNITS.forEach(u => unitsEl.append(uButton(u.id, u.name, u.title)));
  unitsEl.append(uButton('all', 'Alle Units', 'Unit 1 bis 3'));
  const unitTitle = h('span', null, unitLabel(unit));
  const progLine = h('p', { class: 'note', style: 'margin-top:12px' });
  function paintProg(id) { const p = unitProgress(id); progLine.textContent = p.safe + ' von ' + p.total + ' Wörtern kannst du schon sicher.'; }
  function select(id) {
    store.unit = id; save();
    ubtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.u === id)));
    unitTitle.textContent = unitLabel(id); paintProg(id);
  }
  paintProg(unit);
  screen(
    h('div', { class: 'hero' }, h('img', { src: TUKA, alt: 'Tuka, die Tukan-Dame', width: 72, height: 72 }),
      h('div', null, h('h1', null, 'Tukas English'), h('p', null, 'MORE! 1'))),
    h('h2', { class: 'sec' }, '1. Wähle eine Unit'), unitsEl,
    h('h2', { class: 'sec' }, '2. Wähle ein Spiel: ', unitTitle),
    h('div', { class: 'modes' },
      modeCard('👆', '#DCEFEF', 'Wörter auswählen', 'Du siehst das deutsche Wort. Wähle das englische.', () => startRound('choose')),
      modeCard('✏️', '#F3E7C9', 'Wörter schreiben', 'Du siehst das deutsche Wort. Schreib es auf Englisch.', () => startRound('words')),
      modeCard('🎯', '#E4ECF4', 'Test', 'Auswählen und Schreiben gemischt, 12 Fragen. Ohne Tipps.', () => startRound('test'))),
    progLine,
    h('p', { class: 'note', style: 'margin-top:4px' }, 'Dein Fortschritt wird nur auf diesem Handy gespeichert.')
  );
}
function unitLabel(id) { if (id === 'all') return 'Alle Units'; const u = UNITS.find(x => x.id === id); return u.name; }
function modeCard(icon, bg, title, text, fn) {
  return h('button', { type: 'button', class: 'mode', onclick: fn },
    h('span', { class: 'ic', style: 'background:' + bg, 'aria-hidden': 'true' }, icon),
    h('span', null, h('h3', null, title), h('p', null, text)));
}

/* ---------- Runde ---------- */
function weightedPick(ids, avoid) {
  const pool = ids.filter(id => !avoid.includes(id));
  const w = pool.map(id => { const l = lv(id); return 1 + (3 - l.c) * 1.5 + l.m * 1.5; });
  let t = w.reduce((a, b) => a + b, 0), r = Math.random() * t;
  for (let i = 0; i < pool.length; i++) { r -= w[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}
function startRound(mode) {
  const unit = store.unit || 'u3';
  const q = [];
  function add(type, n) {
    const ids = idsOf(unit, type === 'sent' ? SENTS : WORDS);
    for (let i = 0; i < Math.min(n, ids.length); i++) q.push({ type, id: weightedPick(ids, q.map(x => x.id)) });
  }
  if (mode === 'test') { add('choose', 6); add('words', 6); q.splice(0, q.length, ...shuffle(q)); }
  else add(mode, 10);
  const round = { mode, q, i: 0, done: 0, total: q.length, first: 0, missed: [] };
  nextQuestion(round);
}

function nextQuestion(round) {
  if (round.i >= round.q.length) { endScreen(round); return; }
  const qq = round.q[round.i];
  let firstTry = true, answered = false, hintUsed = false, wrong = 0;
  const bar = h('i', { style: 'width:' + Math.round(round.done / round.total * 100) + '%' });
  const stars = h('span', { class: 'stars', 'aria-label': 'Sterne' }, '⭐ ' + round.first);
  const answers = h('div');
  const hintBox = h('div', { class: 'hintbox', hidden: true });
  const fb = h('div', { class: 'fb', hidden: true });
  const hintBtn = h('button', { type: 'button', onclick: () => doHint() }, '💡 Tipp');
  const skipBtn = h('button', { type: 'button', onclick: () => doSkip() }, 'Weiß ich nicht');
  const helpers = h('div', { class: 'helpers' }, round.mode === 'test' ? null : hintBtn, skipBtn);
  const top = h('div', { class: 'qtop' },
    h('button', { type: 'button', class: 'back', 'aria-label': 'Beenden', onclick: homeScreen }, '✕'),
    h('span', { class: 'bar' }, bar), h('span', { class: 'count' }, (round.done + 1) + '/' + round.total), stars);

  function requeue() {
    if (qq.again || round.mode === 'test') return;
    round.q.splice(Math.min(round.q.length, round.i + 3), 0, { type: qq.type, id: qq.id, again: 1 }); round.total++;
  }
  function finish(ok, title, body, extra) {
    if (answered) return; answered = true;
    const counted = ok && firstTry && !hintUsed;
    levelUp(qq.id, counted);
    if (counted) round.first++; else { if (!round.missed.some(m => m.id === qq.id)) round.missed.push(qq); }
    if (!counted && !ok) requeue();
    round.done++;
    bar.style.width = Math.round(round.done / round.total * 100) + '%';
    stars.textContent = '⭐ ' + round.first;
    helpers.hidden = true; hintBox.hidden = true;
    fb.className = 'fb ' + (ok ? 'good' : 'soft');
    const nextBtn = h('button', { type: 'button', class: 'next', onclick: () => { round.i++; nextQuestion(round); } }, round.i + 1 >= round.q.length ? 'Fertig' : 'Weiter');
    rc(fb, h('div', { class: 'ft' }, title), body, extra, nextBtn);
    fb.hidden = false;
    setTimeout(() => { try { nextBtn.focus({ preventScroll: true }); fb.scrollIntoView({ block: 'nearest' }); } catch (e) {} }, 60);
  }

  let doHint = () => {}, doSkip = () => {};
  if (qq.type === 'choose') {
    const w = BYID[qq.id];
    const main = w.en[0];
    // drei falsche Antworten aus derselben Unit, nie eine, die auch richtig wäre
    const pool = shuffle(WORDS.filter(o => o.unit === w.unit && o.id !== w.id && !o.en.some(e => w.en.includes(e)) && !(o.de === w.de && o.note === w.note)));
    const wrongs = [];
    for (const o of pool) { if (!wrongs.includes(o.en[0])) wrongs.push(o.en[0]); if (wrongs.length === 3) break; }
    const opts = h('div', { class: 'opts' });
    shuffle([main, ...wrongs]).forEach(v => { const b = h('button', { type: 'button', class: 'opt', onclick: () => pickIt(v, b) }, v); b.dataset.v = v; opts.append(b); });
    rc(answers, opts);
    const sayBtn = () => canSpeak ? h('button', { type: 'button', class: 'say', onclick: () => say(main) }, '🔊 Anhören') : null;
    const lock = mark => opts.querySelectorAll('button').forEach(x => { x.disabled = true; if (mark && x.dataset.v === main) x.classList.add('ok'); });
    function pickIt(v, b) {
      if (answered) return;
      if (v === main) { b.classList.add('ok'); lock(false); finish(true, pick(PRAISE), h('div', { class: 'word' }, main), sayBtn()); return; }
      firstTry = false; wrong++; b.classList.add('bad'); b.disabled = true;
      if (wrong >= 2) { lock(true); finish(false, pick(SOFT), h('div', null, h('div', { class: 'fx' }, 'Richtig ist:'), h('div', { class: 'word' }, main), round.mode === 'test' ? null : h('div', { class: 'fx' }, 'Das Wort kommt gleich nochmal.')), sayBtn()); return; }
      const o = WORDS.find(x => x.unit === w.unit && x.en[0] === v);
      hintBox.hidden = false; rc(hintBox, o ? '„' + v + '“ heißt ' + o.de + (o.note ? ' (' + o.note + ')' : '') + '. Versuch es nochmal!' : 'Noch nicht. Versuch es nochmal!');
    }
    doHint = function () {
      if (answered) return; hintUsed = true; hintBtn.disabled = true;
      const wr = [...opts.querySelectorAll('.opt:not([disabled])')].filter(x => x.dataset.v !== main);
      shuffle(wr).slice(0, Math.max(0, wr.length - 1)).forEach(x => { x.disabled = true; x.style.visibility = 'hidden'; });
      hintBox.hidden = false; rc(hintBox, '💡 Tuka hat falsche Antworten weggenommen.');
    };
    doSkip = function () {
      if (answered) return; firstTry = false; lock(true);
      finish(false, 'Kein Problem!', h('div', null, h('div', { class: 'word' }, main), round.mode === 'test' ? null : h('div', { class: 'fx' }, 'Das Wort kommt gleich nochmal.')), sayBtn());
    };
    screen(top,
      h('div', { class: 'qcard' }, h('img', { src: TUKA, alt: '' }),
        h('div', null, h('div', { class: 'qlabel' }, 'Wähle das englische Wort:'), h('div', { class: 'qtext' }, w.de), w.note ? h('div', { class: 'qsub' }, '(' + w.note + ')') : null)),
      answers, hintBox, fb, helpers);
  } else if (qq.type === 'words') {
    const w = BYID[qq.id];
    const main = w.en[0];
    const inp = h('input', { type: 'text', autocomplete: 'off', autocorrect: 'off', autocapitalize: 'none', spellcheck: 'false', enterkeyhint: 'done', 'aria-label': 'Englisches Wort', placeholder: 'auf Englisch …' });
    const go = h('button', { type: 'submit' }, 'Prüfen');
    rc(answers, h('form', { class: 'write', onsubmit: e => { e.preventDefault(); test(); } }, inp, go));
    const wordBox = () => h('div', null, h('div', { class: 'word' }, main), w.en.length > 1 ? h('div', { class: 'fx' }, 'Auch richtig: ' + w.en.slice(1).join(', ')) : null);
    const sayBtn = () => canSpeak ? h('button', { type: 'button', class: 'say', onclick: () => say(main) }, '🔊 Anhören') : null;
    function test() {
      if (answered) return;
      const res = check(w, inp.value);
      if (res === 'empty') { inp.focus(); return; }
      if (res === 'ok') { inp.disabled = go.disabled = true; finish(true, pick(PRAISE), wordBox(), sayBtn()); return; }
      if (res === 'close') { firstTry = false; inp.disabled = go.disabled = true; finish(true, 'Fast richtig!', h('div', null, h('div', { class: 'fx' }, 'So schreibt man es genau:'), wordBox()), sayBtn()); return; }
      firstTry = false; wrong++;
      if (wrong >= 2) { inp.disabled = go.disabled = true; finish(false, pick(SOFT), h('div', null, h('div', { class: 'fx' }, 'Richtig ist:'), wordBox(), round.mode === 'test' ? null : h('div', { class: 'fx' }, 'Das Wort kommt gleich nochmal.')), sayBtn()); return; }
      hintBox.hidden = false;
      rc(hintBox, res.other ? '„' + inp.value.trim() + '“ heißt ' + res.other.de + (res.other.note ? ' (' + res.other.note + ')' : '') + '. Versuch es nochmal!' : 'Noch nicht ganz. Versuch es nochmal!');
      inp.select();
    }
    doHint = function () {
      if (answered) return; hintUsed = true; hintBtn.disabled = true;
      hintBox.hidden = false;
      rc(hintBox, '💡 So beginnt es: ', h('span', { class: 'pat' }, pattern(main)));
      inp.focus();
    }
    doSkip = function () {
      if (answered) return; firstTry = false; inp.disabled = go.disabled = true;
      finish(false, 'Kein Problem!', h('div', null, wordBox(), round.mode === 'test' ? null : h('div', { class: 'fx' }, 'Das Wort kommt gleich nochmal. Dann weißt du es.')), sayBtn());
    }
    screen(top,
      h('div', { class: 'qcard' }, h('img', { src: TUKA, alt: '' }),
        h('div', null, h('div', { class: 'qlabel' }, 'Schreib auf Englisch:'), h('div', { class: 'qtext' }, w.de), w.note ? h('div', { class: 'qsub' }, '(' + w.note + ')') : null)),
      answers, hintBox, fb, helpers);
    setTimeout(() => { try { inp.focus({ preventScroll: true }); } catch (e) {} }, 120);
  } else {
    const s = SENTS.find(x => x.id === qq.id);
    const opts = h('div', { class: 'opts' });
    shuffle([s.ok, ...s.wrong]).forEach(v => {
      const b = h('button', { type: 'button', class: 'opt', onclick: () => pickIt(v, b) }, v); b.dataset.v = v; opts.append(b);
    });
    rc(answers, opts);
    const full = () => s.text.replace('___', s.ok).replace(/\s+\(.*?\)\s*$/, '').replace(' ,', ',').replace(' !', '!');
    function pickIt(v, b) {
      if (answered) return;
      if (v === s.ok) { b.classList.add('ok'); opts.querySelectorAll('button').forEach(x => x.disabled = true); finish(true, pick(PRAISE), h('div', { class: 'fx' }, s.rule)); return; }
      firstTry = false; wrong++; b.classList.add('bad'); b.disabled = true;
      if (wrong >= 2) {
        opts.querySelectorAll('button').forEach(x => { x.disabled = true; if (x.dataset.v === s.ok) x.classList.add('ok'); });
        finish(false, pick(SOFT), h('div', null, h('div', { class: 'fx' }, 'Richtig ist: ' + full()), h('div', { class: 'fx' }, s.rule)));
        return;
      }
      hintBox.hidden = false; rc(hintBox, round.mode === 'test' ? 'Noch nicht. Versuch es nochmal!' : 'Noch nicht. 💡 ' + s.rule);
      if (round.mode !== 'test') { hintUsed = true; hintBtn.disabled = true; }
    }
    doHint = function () { if (answered) return; hintUsed = true; hintBtn.disabled = true; hintBox.hidden = false; rc(hintBox, '💡 ' + s.rule); };
    doSkip = function () {
      if (answered) return; firstTry = false;
      opts.querySelectorAll('button').forEach(x => { x.disabled = true; if (x.dataset.v === s.ok) x.classList.add('ok'); });
      finish(false, 'Kein Problem!', h('div', null, h('div', { class: 'fx' }, 'Richtig ist: ' + full()), h('div', { class: 'fx' }, s.rule)));
    }
    screen(top,
      h('div', { class: 'qcard' }, h('img', { src: TUKA, alt: '' }),
        h('div', null, h('div', { class: 'qlabel' }, 'Welches Wort passt?'), h('div', { class: 'qtext sent' }, s.text))),
      answers, hintBox, fb, helpers);
  }
}

function endScreen(round) {
  const share = round.first / round.total;
  const title = share >= 1 ? 'Alles richtig!' : share >= 0.8 ? 'Wow, fast alles!' : share >= 0.5 ? 'Geschafft, super!' : 'Geschafft!';
  const starsN = share >= 0.8 ? 3 : share >= 0.5 ? 2 : 1;
  const row = m => m.type !== 'sent'
    ? h('div', { class: 'row' }, h('span', null, BYID[m.id].de + (BYID[m.id].note ? ' (' + BYID[m.id].note + ')' : '')), h('span', null, BYID[m.id].en[0]))
    : (s => h('div', { class: 'row' }, h('span', null, s.text.replace('___', '…')), h('span', null, s.ok)))(SENTS.find(x => x.id === m.id));
  screen(h('div', { class: 'end' },
    h('img', { src: TUKA, alt: 'Tuka freut sich' }),
    h('h2', null, title),
    h('div', { class: 'starrow', 'aria-label': starsN + ' Sterne' }, '⭐'.repeat(starsN)),
    h('p', { style: 'margin:0;font-size:18px' }, round.mode === 'test' ? 'Du hast ' + round.first + ' von ' + round.total + ' Punkten.' : 'Du hast ' + round.first + ' von ' + round.total + ' gleich beim ersten Mal gewusst.'),
    round.missed.length ? h('div', { class: 'again' }, h('h3', { style: 'font-size:19px;margin-bottom:8px' }, 'Das übst du nochmal:'), h('div', { class: 'list' }, ...round.missed.map(row))) : h('p', { class: 'muted', style: 'margin:0' }, 'Tuka ist stolz auf dich!'),
    h('div', { class: 'btns' },
      h('button', { type: 'button', class: 'next', onclick: () => startRound(round.mode) }, 'Nochmal'),
      h('button', { type: 'button', class: 'ghost', onclick: homeScreen }, 'Zur Übersicht'))));
}

homeScreen();
</script>
</body>
</html>
