<style>
@import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap');
:root{
  --jungle:#1F5E3B; --leaf:#3FA34D; --sand:#F6EBD5; --sun:#F28C28; --lagoon:#1BA6A6; --ink:#1C2B24;
  --deep:#16452B; --sand2:#EBDCBC; --paper:#FBF5E8; --leafsoft:#DCEFD9; --sunsoft:#FCE3C6; --lagoonsoft:#D3EFEE;
  --display:"Fredoka","Baloo 2","Nunito",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --text:"Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;
  --roman:"Trajan Pro","Cinzel",Georgia,"Times New Roman",serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--jungle);color:var(--ink);font-family:var(--text);font-size:18px;line-height:1.45;
  background-image:radial-gradient(circle at 12% 8%, rgba(63,163,77,.35) 0 120px, transparent 121px),radial-gradient(circle at 92% 30%, rgba(22,69,43,.6) 0 160px, transparent 161px),radial-gradient(circle at 6% 85%, rgba(22,69,43,.55) 0 140px, transparent 141px);
  background-attachment:fixed;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--lagoon);outline-offset:3px;border-radius:10px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 40px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Map screen ---------- */
.maphead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;color:var(--sand);margin-bottom:12px}
.maphead h1{font-size:clamp(30px,6.4vw,46px);letter-spacing:.2px;flex:1 1 280px}
.maphead h1 span{display:block;font-family:var(--text);font-weight:400;font-size:16px;color:#cfe6cf;letter-spacing:0;margin-top:4px}
.leader{display:flex;flex-direction:column;gap:2px;font-size:15px;color:#cfe6cf}
.leader input{font:600 20px var(--display);color:var(--ink);background:var(--sand);border:0;border-radius:12px;padding:8px 12px;width:200px;min-height:44px}
.iconbtn{min-width:48px;min-height:48px;border-radius:14px;border:2px solid rgba(246,235,213,.35);background:rgba(0,0,0,.12);color:var(--sand);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:15px}
.iconbtn svg{width:24px;height:24px}
.hello{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.hello .tuka{width:74px;height:74px;flex:none}
.bubble{position:relative;background:var(--paper);border-radius:18px;padding:10px 14px;font-size:17px;line-height:1.35;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.bubble::before{content:"";position:absolute;left:-9px;top:22px;border:9px solid transparent;border-left:0;border-right-color:var(--paper)}
.bubble b.who{font-family:var(--display);font-weight:600;color:var(--jungle)}

.map{position:relative;width:100%;border-radius:26px;background:var(--sand);box-shadow:0 0 0 6px var(--deep),0 10px 0 6px rgba(0,0,0,.18);overflow:hidden}
.map svg.terrain{position:absolute;inset:0;width:100%;height:100%;display:block}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;width:132px;text-align:center}
.node .disc{position:relative;width:76px;height:76px;border-radius:50%;background:var(--paper);border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(28,43,36,.35);transition:transform .15s}
.node:hover .disc{transform:translateY(-2px)}
.node .disc svg{width:46px;height:46px}
.node .no{position:absolute;left:-8px;top:-8px;width:30px;height:30px;border-radius:50%;background:var(--sun);color:var(--ink);font:700 17px var(--display);display:flex;align-items:center;justify-content:center;border:3px solid var(--ink)}
.node .lbl{font:600 15px/1.15 var(--display);color:var(--ink);background:rgba(246,235,213,.92);border-radius:8px;padding:2px 6px}
.node .stars{display:flex;gap:1px;height:18px}
.node .stars svg{width:18px;height:18px}
.node.done .disc{border-color:var(--jungle);background:var(--leafsoft)}
.node.next .disc::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:4px dashed var(--sun);animation:spin 9s linear infinite}
.node .tag{font-size:13px;font-weight:700;color:var(--paper);background:var(--sun);border-radius:6px;padding:0 6px;color:var(--ink)}
.node.final .disc{width:88px;height:88px;background:var(--sunsoft)}
@keyframes spin{to{transform:rotate(360deg)}}

.pack{margin-top:22px;background:var(--deep);border-radius:22px;padding:14px 16px;color:var(--sand)}
.pack h2{font-size:22px;margin-bottom:10px}
.slots{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;text-align:center;line-height:1.15}
.slot .box{width:62px;height:62px;border-radius:16px;border:2px dashed rgba(246,235,213,.4);display:flex;align-items:center;justify-content:center}
.slot.got .box{border:2px solid var(--sun);background:rgba(246,235,213,.12)}
.slot svg{width:44px;height:44px}
.slot:not(.got) svg{opacity:.25;filter:grayscale(1)}
.parents{margin-top:16px;background:rgba(0,0,0,.14);border-radius:18px;color:var(--sand);padding:4px 16px}
.parents summary{min-height:48px;display:flex;align-items:center;font:600 18px var(--display);cursor:pointer}
.parents .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.parents td:nth-child(2),.parents td:nth-child(3),.parents td:nth-child(4){white-space:nowrap}
.parents table{width:100%;min-width:560px;border-collapse:collapse;font-size:15px;margin:6px 0 10px}
.parents th,.parents td{text-align:left;padding:7px 6px;border-bottom:1px solid rgba(246,235,213,.18);vertical-align:top}
.parents th{font-weight:700}
.parents p{font-size:15px;margin:6px 0}
.btn{min-height:52px;border-radius:16px;border:0;padding:10px 22px;font:600 19px var(--display);background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #b4600f}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #b4600f}
.btn.ghost{background:transparent;color:inherit;box-shadow:none;border:2px solid currentColor}
.btn.green{background:var(--leaf);color:#fff;box-shadow:0 4px 0 var(--jungle)}
.btn:disabled{opacity:.4;box-shadow:none}
.confirm{background:var(--paper);color:var(--ink);border-radius:14px;padding:12px;margin:8px 0 14px}
.confirm .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}

/* ---------- Station screen ---------- */
.bar{display:flex;align-items:center;gap:10px;color:var(--sand);margin-bottom:10px}
.bar h2{font-size:clamp(19px,4.6vw,26px);flex:1;min-width:0}
.bar h2 small{display:block;font:400 14px var(--text);color:#cfe6cf}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 10px}
.dots i{width:14px;height:14px;border-radius:50%;background:rgba(246,235,213,.25);display:block}
.dots i.ok{background:var(--leaf)}.dots i.meh{background:var(--sun)}.dots i.cur{box-shadow:0 0 0 3px var(--sand)}
.dots span{font-size:14px;color:var(--sand);margin-left:6px}
.stage{display:grid;gap:14px;max-width:760px;margin:0 auto}
.talk{display:flex;align-items:flex-start;gap:10px}
.talk .tuka{width:72px;height:72px;flex:none;margin-top:-4px}
.talk .bubble{flex:1;min-height:56px}
.card{background:var(--sand);border-radius:24px;padding:18px 18px 20px;box-shadow:0 6px 0 var(--deep);position:relative}
.q{font-size:21px;line-height:1.4}
.big{display:inline-block;font-family:var(--text);font-weight:700;font-size:clamp(28px,7.6vw,40px);line-height:1.25;letter-spacing:.3px;color:var(--ink);margin:4px 0}
.roman{font-family:var(--roman);letter-spacing:3px}
.gap{display:inline-block;min-width:1.4em;border:3px dashed var(--lagoon);border-radius:10px;text-align:center;color:var(--lagoon)}
.fig{margin-top:12px}
.fig:empty{display:none}
.input{margin-top:16px}
.fb{margin-top:14px}
.fb:empty{display:none}
.fb{scroll-margin-top:64px}
.btn.skip{font-size:17px;border-width:2px;color:var(--ink);opacity:.85}
.fb .sol{background:var(--paper);border-radius:16px;padding:12px 14px;border-left:6px solid var(--leaf)}
.fb .sol.re{border-left-color:var(--sun)}
.fb .sol .big{font-size:clamp(26px,6.6vw,34px)}
.fb .next{margin-top:12px;width:100%}
.second{font-size:15px;color:var(--jungle);font-weight:700;margin-top:8px}

/* number pad */
.disp{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-weight:700;font-size:clamp(26px,7vw,34px)}
.disp .val{min-width:3.4em;min-height:62px;flex:1 1 auto;max-width:100%;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:6px 14px;display:flex;align-items:center;letter-spacing:.5px;white-space:nowrap;overflow:hidden}
.disp .val.empty::after{content:"";width:3px;height:1.1em;background:var(--lagoon);animation:blink 1s steps(1) infinite}
.disp .val.right{border-color:var(--leaf);background:var(--leafsoft)}
@keyframes blink{50%{opacity:0}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.keys button{min-height:60px;border-radius:14px;border:0;background:var(--paper);font:700 30px var(--text);box-shadow:0 3px 0 var(--sand2)}
.keys button:active{transform:translateY(2px);box-shadow:none}
.keys .del{font:600 18px var(--display);background:var(--sand2)}
.keys .go{font:600 20px var(--display);background:var(--sun);box-shadow:0 3px 0 #b4600f}
.keys.rom{grid-template-columns:repeat(4,1fr)}
.keys.rom .r{font:700 30px var(--roman);background:#e7dcc6;box-shadow:0 3px 0 #b9a985}
.keys.rom .r small{display:block;font:400 12px var(--text);margin-top:-2px}
.input.locked .keys,.input.locked .act,.input.locked .nudge{display:none}
.nudge{display:flex;gap:10px;margin-top:6px}
.nudge .btn{flex:1 1 0;min-height:56px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.nudge svg{width:24px;height:24px}

/* choice / multi */
.opts{display:grid;gap:10px}
.opts button{min-height:56px;border-radius:14px;border:3px solid var(--ink);background:var(--paper);padding:10px 14px;font-size:21px;font-weight:700;text-align:left}
.opts.row{grid-template-columns:repeat(auto-fit,minmax(64px,1fr))}
.opts.row button{text-align:center;font-size:34px;min-height:68px}
.opts.romanopts button{font-family:var(--roman);letter-spacing:2px;text-align:center}
.opts button.tried{opacity:.45;text-decoration:line-through}
.opts button.right{border-color:var(--leaf);background:var(--leafsoft)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips button{min-width:64px;min-height:56px;border-radius:14px;border:3px solid var(--ink);background:var(--paper);font-size:22px;font-weight:700;padding:6px 12px}
.chips.words button{font-size:18px;font-weight:400;text-align:left;flex:1 1 220px}
.chips.romanchips button{font-family:var(--roman);letter-spacing:2px}
.chips button[aria-pressed="true"]{background:var(--lagoon);color:#fff;border-color:var(--lagoon)}
.chips button.must{box-shadow:0 0 0 4px var(--leaf)}
.act{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.act .btn{flex:1 1 160px}
.linepts{position:relative;display:grid;grid-template-columns:repeat(7,1fr);padding-top:4px}
.linepts::before{content:"";position:absolute;left:0;right:-6px;top:26px;height:4px;background:var(--ink);border-radius:2px}
.linepts::after{content:"";position:absolute;right:-12px;top:19px;border:9px solid transparent;border-right:0;border-left:14px solid var(--ink)}
.linepts button{position:relative;display:flex;flex-direction:column;align-items:center;background:none;border:0;min-height:76px;padding:0;font:700 20px var(--text)}
.linepts button i{width:30px;height:30px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);margin-top:13px;margin-bottom:6px}
.linepts button[aria-pressed="true"] i{background:var(--lagoon);border-color:var(--lagoon)}
.linepts button.must i{box-shadow:0 0 0 4px var(--leaf)}

/* tiles: order, build, place */
.tray{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;align-items:center}
.tile{min-width:58px;min-height:58px;border-radius:12px;border:3px solid var(--ink);background:var(--paper);font:700 26px var(--text);padding:4px 12px;box-shadow:0 3px 0 rgba(28,43,36,.25)}
.tile.sel{background:var(--lagoon);border-color:var(--lagoon);color:#fff;transform:translateY(-3px)}
.tile.used{visibility:hidden}
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:70px;background:var(--paper);border:3px dashed var(--ink);border-radius:16px;padding:8px;margin-bottom:12px}
.chain .sep{font:700 28px var(--text);color:var(--jungle)}
.chain .ph{color:#6d7a72;font-size:16px;padding:0 6px}
.digitcard{width:58px;height:70px;border-radius:12px;border:3px solid var(--ink);background:var(--paper);font:700 34px var(--text);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(28,43,36,.25)}
.slotrow{display:grid;gap:6px;margin-bottom:14px}
.slotrow .col{display:flex;flex-direction:column;align-items:center;gap:4px}
.slotrow .col b{font:700 16px var(--text)}
.slotrow .col button{width:100%;max-width:62px;height:66px;border-radius:12px;border:3px dashed var(--ink);background:rgba(255,255,255,.5);font:700 30px var(--text)}
.slotrow .col button.full{border-style:solid;background:var(--paper)}
.slotrow .col.g button{box-shadow:6px 0 0 -3px var(--sand)}
.hintline{font-size:15px;color:#46564d;margin-bottom:8px}
.digits{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.digits button{width:50px;height:66px;border-radius:12px;border:3px solid var(--ink);background:var(--paper);font:700 32px var(--text)}
.digits .sp{width:12px}
.digits button.tried{opacity:.4}
.digits button.right{background:var(--leafsoft);border-color:var(--leaf)}

/* figures */
.blocks{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end;background:var(--paper);border-radius:16px;padding:12px}
.blocks .grp{display:flex;flex-wrap:wrap;gap:5px;align-items:flex-end;max-width:100%}
.blocks svg{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.svt{border-collapse:separate;border-spacing:0;background:var(--paper);border-radius:12px;overflow:hidden;width:100%;max-width:640px;table-layout:fixed}
.svt th,.svt td{text-align:center;padding:6px 0;border-right:1px solid var(--sand2)}
.svt th{font:700 15px var(--text);background:var(--lagoonsoft)}
.svt td{font:700 clamp(22px,6vw,30px) var(--text)}
.svt .g{border-right:4px solid var(--jungle)}
.svt th:last-child,.svt td:last-child{border-right:0}
.figsvg{display:block;width:100%;height:auto;background:var(--paper);border-radius:16px;touch-action:manipulation}
.figsvg.tap{cursor:crosshair}
.packets{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.packets div{background:var(--paper);border-radius:12px;padding:6px 12px;text-align:center}
.packets b{display:block;font-size:32px}
.packets span{font-size:14px}
.ex{background:var(--paper);border-radius:16px;padding:12px 14px;font-size:19px}
.ex .big{font-size:clamp(24px,6vw,32px)}

/* intro + end */
.intro p{margin:0 0 10px;font-size:20px}
.intro .rule{font:600 clamp(26px,6.4vw,34px)/1.15 var(--display);color:var(--jungle);margin:0 0 12px}
.q:focus{outline:none}
.intro .act .btn{flex:1 1 220px}
.end{text-align:center}
.end .art{width:150px;height:150px;margin:0 auto}
.end .bigstars{display:flex;justify-content:center;gap:8px;margin:10px 0}
.end .bigstars svg{width:56px;height:56px}
.end h3{font-size:clamp(24px,6vw,32px);margin:6px 0}
.end p{font-size:19px;margin:6px 0}
.end .act{justify-content:center}
.chest{width:min(300px,80%);height:auto;margin:0 auto;display:block}
.chest .lid{transform-origin:40px 92px;transition:transform 1.1s cubic-bezier(.3,1.6,.5,1) .3s}
.chest.open .lid{transform:rotate(-34deg)}
.chest .glow{opacity:0;transition:opacity .8s .7s}
.chest.open .glow{opacity:1}

/* tuka moods */
.tuka .m{display:none}
.tuka[data-mood="happy"] .m-happy,.tuka[data-mood="think"] .m-think,.tuka[data-mood="oops"] .m-oops{display:inline}
.tuka.hop{animation:hop .5s ease}
@keyframes hop{30%{transform:translateY(-10px) rotate(-6deg)}60%{transform:translateY(0) rotate(3deg)}}
.burst{position:absolute;left:50%;top:40%;pointer-events:none}
.burst i{position:absolute;width:14px;height:14px;border-radius:3px 12px;background:var(--leaf);animation:fly .8s ease-out forwards}
.burst i:nth-child(3n){background:var(--sun);border-radius:50%}

<script>
const G = (() => {
'use strict';
const PL = ['E','Z','H','T','ZT','HT','M','ZM','HM','Md','ZMd','HMd','B'];
const PLN = ['Einer','Zehner','Hunderter','Tausender','Zehntausender','Hunderttausender','Millionen','Zehnmillionen','Hundertmillionen','Milliarden'];
const NB = ' ';
const P = i => Math.pow(10, i);
const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const pick = (r, a) => a[Math.floor(r() * a.length)];
const shuffle = (r, a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
const fmt = n => { const s = String(n); return s.length < 5 ? s : s.replace(/\B(?=(\d{3})+(?!\d))/g, NB); };
const dig = (n, i) => Math.floor(n / P(i)) % 10;
const len = n => String(n).length;
const big = s => '<span class="big">' + s + '</span>';
function randNum(r, d, z) {
  z = z == null ? 0.1 : z;
  let s = String(ri(r, 1, 9));
  for (let i = 1; i < d; i++) s += (r() < z ? '0' : String(ri(r, 0, 9)));
  return Number(s);
}
function unitsStr(n) { const o = []; for (let i = len(n) - 1; i >= 0; i--) { const d = dig(n, i); if (d) o.push(d + PL[i]); } return o.join(' '); }
function sumStr(n, zeros) { const o = []; for (let i = len(n) - 1; i >= 0; i--) { const d = dig(n, i); if (d || zeros) o.push(d + '·' + fmt(P(i))); } return o.join(' + '); }
function wordsStr(n) {
  const md = Math.floor(n / 1e9), m = Math.floor(n / 1e6) % 1000, t = Math.floor(n / 1e3) % 1000, e = n % 1000, p = [];
  if (md) p.push(md + (md === 1 ? ' Milliarde' : ' Milliarden'));
  if (m) p.push(m + (m === 1 ? ' Million' : ' Millionen'));
  if (t) p.push(t + ' Tausend');
  if (e) p.push(String(e));
  return p.join(' ');
}
const roundTo = (n, p) => { const u = P(p); return Math.floor((n + u / 2) / u) * u; };
function chainSteps(n, p) { const a = []; let x = n; for (let i = 1; i <= p; i++) { x = roundTo(x, i); a.push(x); } return a; }
const RT = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
function toRoman(n) { let s = ''; for (const [v, t] of RT) while (n >= v) { s += t; n -= v; } return s; }
const RV = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };
function fromRoman(s) { let t = 0; for (let i = 0; i < s.length; i++) { const v = RV[s[i]], w = RV[s[i + 1]] || 0; if (!v) return NaN; t += v < w ? -v : v; } return t; }
const canon = s => { const v = fromRoman(s); return v > 0 && v < 4000 && toRoman(v) === s; };
function additive(n) { return toRoman(n).replace('CM','DCCCC').replace('CD','CCCC').replace('XC','LXXXX').replace('XL','XXXX').replace('IX','VIIII').replace('IV','IIII'); }
function perms(a) {
  if (a.length <= 1) return [a.slice()];
  const out = [], seen = new Set();
  a.forEach((x, i) => { if (seen.has(x)) return; seen.add(x); perms(a.slice(0, i).concat(a.slice(i + 1))).forEach(p => out.push([x].concat(p))); });
  return out;
}
function decompose(n) { const o = []; for (let i = len(n) - 1; i >= 0; i--) { const d = dig(n, i); if (d) o.push(fmt(d * P(i))); } return o.join(' + '); }
function romanParts(n) { const o = []; for (let i = len(n) - 1; i >= 0; i--) { const d = dig(n, i); if (d) o.push(toRoman(d * P(i))); } return o.join(' + '); }
// number with one unique, nonzero digit at a position >= minPos
function numWithUnique(r, d, minPos) {
  for (;;) {
    const n = randNum(r, d, 0.1), s = String(n), c = [];
    for (let i = minPos; i < d; i++) { const g = dig(n, i); if (g > 0 && s.split(String(g)).length === 2) c.push(i); }
    if (c.length) return { n, i: pick(r, c) };
  }
}
function check(t, a) {
  if (t.kind === 'multi' || t.kind === 'order' || t.kind === 'place') return Array.isArray(a) && a.length === t.answer.length && a.every((x, i) => x === t.answer[i]);
  return a === t.answer;
}
const setStr = (list, inf) => '{' + list.join('; ') + (inf ? '; ...' : '') + '}';
const range = (a, b) => { const o = []; for (let i = a; i <= b; i++) o.push(i); return o; };

const gens = {};

/* ---------- 1 Basislager der Stellenwerte ---------- */
gens.s1_blocks = (r, lvl) => {
  const c = [ri(r, 1, lvl > 1 ? 5 : 3), ri(r, 1, 9), ri(r, 1, 9), ri(r, 1, 9)];
  if (lvl > 1) c[ri(r, 1, 3)] = 0;
  const n = c[0] * 1000 + c[1] * 100 + c[2] * 10 + c[3];
  const squeezed = Number(c.filter(x => x > 0).join(''));
  return { gen: 's1_blocks', topic: 'Zehnersystem-Material', kind: 'num',
    q: 'Welche Zahl zeigt das Material?', fig: { type: 'blocks', c }, answer: n,
    hint: 'Zähl jede Sorte einzeln. Würfel 1000, Platte 100, Stange 10, Würfelchen 1.',
    diag: a => (c.includes(0) && a === squeezed) ? 'Eine Sorte fehlt. Dort steht dann eine 0.' : null,
    explain: 'T: ' + c[0] + ', H: ' + c[1] + ', Z: ' + c[2] + ', E: ' + c[3] + '. Also ' + big(fmt(n)), meta: { c } };
};
gens.s1_place = (r, lvl) => {
  const d = lvl === 1 ? 4 : lvl === 2 ? 5 : 6;
  const zc = lvl === 1 ? 1 : 2;
  const ds = [ri(r, 1, 9)]; for (let i = 1; i < d; i++) ds.push(ri(r, 1, 9));
  const zpos = shuffle(r, range(1, d - 1)).slice(0, zc); zpos.forEach(p => { ds[p] = 0; });
  const n = Number(ds.join(''));
  let entries = []; for (let i = d - 1; i >= 0; i--) { const g = dig(n, i); if (g) entries.push(g + PL[i]); }
  if (lvl === 3) { const sh = shuffle(r, entries); entries = sh; }
  const cards = shuffle(r, ds.concat([ri(r, 1, 9)]));
  return { gen: 's1_place', topic: 'Stellenwerttafel füllen', kind: 'place',
    q: 'Bau diese Zahl in der Stellenwerttafel:<br>' + big(entries.join(' ')),

    hint: 'Jede Einheit kommt in ihre Spalte. Leere Spalten bekommen eine 0.',
    diag: a => (Array.isArray(a) && zpos.some(p => a[p] !== 0)) ? 'Schau auf die Spalten ohne Einheit. Dort gehört eine 0 hin.' : null,
    explain: 'Von links: ' + ds.map((x, i) => PL[d - 1 - i] + ' ' + x).join(', ') + '. Das ist ' + big(fmt(n)) + '. Ein Kärtchen bleibt übrig.', meta: { n, units: entries.join(' ') } };
};
gens.s1_value = (r, lvl) => {
  const d = lvl === 1 ? ri(r, 4, 5) : lvl === 2 ? ri(r, 6, 7) : ri(r, 8, 10);

    q: 'Welchen Wert hat die Ziffer <b>' + g + '</b> in ' + big(fmt(n)) + '?', answer: v,
    hint: 'Je weiter links, desto mehr wert. Zähl die Stellen von rechts: E, Z, H, T ...',
    diag: a => a === g ? 'Das ist nur die Ziffer. Gefragt ist ihr Wert.' : (a === g * P(i + 1) || (i > 0 && a === g * P(i - 1))) ? 'Knapp! Eine Stelle daneben. Zähl von rechts nochmal.' : null,
    explain: 'Die ' + g + ' steht bei ' + PL[i] + ' (' + PLN[i] + '). Wert: ' + g + '·' + fmt(P(i)) + ' = ' + big(fmt(v)), meta: { n, i } };
};
gens.s1_stelle = (r, lvl) => {
  const d = lvl === 1 ? 5 : ri(r, 6, 8);
  const { n, i } = numWithUnique(r, d, 1);

gens.s1_table = (r, lvl) => {
  const d = lvl === 1 ? ri(r, 5, 6) : lvl === 2 ? ri(r, 7, 9) : 10;

gens.s1_tuka_zero = (r, lvl) => {
  const d = ri(r, 4, 6);

gens.s1_tuka_value = (r, lvl) => {
  const { n, i } = numWithUnique(r, ri(r, 5, 7), 2);

};

/* ---------- 2 Wasserfall der großen Zahlen ---------- */
function mixedUnits(r, lvl) {
  const top = lvl === 1 ? ri(r, 3, 4) : lvl === 2 ? ri(r, 5, 6) : ri(r, 7, 9);
  const k = lvl === 1 ? 3 : 4;
  const places = [top].concat(shuffle(r, range(0, top - 1)).slice(0, k - 1));
  const ent = places.map(p => ({ d: ri(r, 1, 9), p }));
  return ent;
}
gens.s2_mixed = (r, lvl) => {
  const ent = mixedUnits(r, lvl);
  let order = shuffle(r, ent);
  const desc = ent.slice().sort((a, b) => b.p - a.p);
  if (order.every((e, i) => e === desc[i])) order = order.slice(1).concat(order[0]);
  const n = ent.reduce((s, e) => s + e.d * P(e.p), 0);
  const asWritten = Number(order.map(e => e.d).join(''));
  const squeezed = Number(desc.map(e => e.d).join(''));
  const str = order.map(e => e.d + PL[e.p]).join(' ');
  return { gen: 's2_mixed', topic: 'Einheiten ordnen', kind: 'num',
    q: 'Schreib mit Ziffern. Achtung, durcheinander:<br>' + big(str), answer: n,
    hint: 'Ordne nach Stellen. Die größte Stelle zuerst.',
    diag: a => a === asWritten ? 'Du hast der Reihe nach abgeschrieben. Ordne zuerst nach Stellen.' : a === squeezed ? 'Die Reihenfolge passt. Aber leere Stellen brauchen eine 0.' : null,
    explain: 'Geordnet: ' + unitsStr(n) + ' = ' + big(fmt(n)), meta: { str, n } };

gens.s2_bundle = (r, lvl) => {
  const places = lvl === 3 ? pick(r, [[3, 2, 0], [3, 2, 1]]) : [2, 1, 0];

    q: 'Welche Zahl ist das? Hier musst du bündeln:<br>' + big(str), answer: n,
    hint: 'Rechne jede Einheit aus: ' + vals[0] + PL[places[0]] + ' = ' + fmt(vals[0] * P(places[0])) + '. Dann zusammenzählen.',
    diag: a => a === concat ? 'Hintereinander schreiben geht hier nicht. Rechne jede Einheit aus.' : null,
    explain: vals.map((v, i) => fmt(v * P(places[i]))).join(' + ') + ' = ' + big(fmt(n)), meta: { str, n } };
};
function groupNum(r, lvl) {
  if (lvl === 1) return ri(r, 2, 999) * 1000 + pick(r, [0, ri(r, 1, 99), ri(r, 100, 999)]);
  if (lvl === 2) return ri(r, 1, 9) * 1e6 + pick(r, [0, ri(r, 1, 99), ri(r, 100, 999)]) * 1000 + ri(r, 1, 99);
  return ri(r, 1, 9) * 1e9 + ri(r, 1, 99) * 1e6 + pick(r, [0, 0, ri(r, 1, 99)]) * 1000 + ri(r, 1, 999);
}
gens.s2_words = (r, lvl) => {
  const n = groupNum(r, lvl), w = wordsStr(n);

    hint: 'Jedes Dreierpäckchen hat genau 3 Ziffern. Fehlt etwas, kommen Nullen hin.',

    explain: w + ' = ' + big(fmt(n)), meta: { w, n } };
};
gens.s2_sum = (r, lvl) => {
  const n = lvl === 1 ? (() => { let x; do { x = randNum(r, 4, 0.25); } while (!/0/.test(String(x).slice(1))); return x; })() : (() => { let x; do { x = randNum(r, ri(r, 6, 7), 0.45); } while (!/0/.test(String(x).slice(1))); return x; })();

  const squeezed = Number(String(n).replace(/0/g, ''));

    hint: 'Jeder Teil hat seine Stelle. Leere Stellen bekommen eine 0.',

gens.s2_units_choice = (r, lvl) => {
  let n; do { n = randNum(r, ri(r, 5, 7), 0.3); } while (!/0/.test(String(n).slice(1)));
  const ent = []; for (let i = len(n) - 1; i >= 0; i--) { const d = dig(n, i); if (d) ent.push({ d, p: i }); }
  const used = new Set(ent.map(e => e.p));

  const correct = str(ent), wrongs = new Set();
  wrongs.add(unitsStr(Number(ent.map(e => e.d).join(''))));

    const e = pick(r, ent), np = e.p + pick(r, [-1, 1]);

    wrongs.add(str(ent.map(x => x === e ? { d: x.d, p: np } : x)));

  const opts = shuffle(r, [correct].concat(shuffle(r, Array.from(wrongs)).slice(0, 3)));

    explain: w + ' = ' + big(fmt(n)), meta: { w, n } };
};
gens.s2_tuka_bundle = (r, lvl) => {
  const vals = [ri(r, 11, 19), ri(r, 11, 19), ri(r, 11, 19)];
  const n = vals[0] * 100 + vals[1] * 10 + vals[2];

  S.tasks.forEach((t, i) => { const r = S.res[i]; h += '<i class="' + (r === 'ok' ? 'ok' : r ? 'meh' : '') + (i === S.i ? ' cur' : '') + '"></i>'; });
  return h + '<span>' + (S.i + 1) + ' von ' + S.tasks.length + '</span></div>';
}
function showTask() {
  if (S.i >= S.tasks.length) {
    if (!S.repStarted && S.rep.length) {
      S.repStarted = true;
      S.rep.forEach(t => { const n = genTask(t.g, t.l, S.seen); n.repeat = true; S.tasks.push(n); });
    } else return finish();
  }
  cur = S.tasks[S.i]; window.scrollTo(0, 0);
  const t = cur, split = (t.kind === 'num' || t.kind === 'roman');
  let talk;
  if (t.repeat && !t.shownRep && S.tasks.indexOf(t) === S.tasks.findIndex(x => x.repeat)) talk = { m: 'think', s: 'Jetzt kommen die kniffligen Aufgaben nochmal. Mit neuen Zahlen.' };
  else if (t.tuka) talk = { m: 'happy', s: '<b>' + esc(t.tuka) + '</b>' };
  else talk = { m: 'happy', s: pickA(QUIPS).replace('{t}', esc(t.topic)) };
  app.innerHTML = '<div class="wrap">' + header(S.st.final ? 'Finale' : esc(t.topic)) + dotsHTML() +
    '<div class="stage' + (split ? ' split' : '') + '"><div class="talk">' + tukaSVG(talk.m) + '<div class="bubble" id="say" aria-live="polite"><b class="who">Tuka:</b> ' + talk.s + '</div></div>' +
    '<div class="card" id="card"><div class="q" id="q" tabindex="-1">' + t.q + '</div><div class="fig" id="fig">' + renderFig(t.fig) + '</div>' + (split ? '' : '<div class="input" id="inp"></div>') + '<div class="fb" id="fb"></div></div>' +
    (split ? '<div class="card padcol"><div class="input" id="inp"></div></div>' : '') + '</div></div>';
  bindHeader();
  inp = INPUTS[t.kind]($('#inp'), t);
  addSkip($('#inp'));
  $('#q').focus({ preventScroll: true });
}
function say(mood, html, hop) {
  const tk = $('.talk .tuka'); if (tk) { tk.dataset.mood = mood; if (hop && !reduced()) { tk.classList.remove('hop'); void tk.getBoundingClientRect(); tk.classList.add('hop'); } }
  const b = $('#say'); if (b) b.innerHTML = '<b class="who">Tuka:</b> ' + html;
}
function burst() {
  if (reduced()) return; const c = $('#card'); if (!c) return;
  const b = document.createElement('div'); b.className = 'burst';
  for (let i = 0; i < 14; i++) { const e = document.createElement('i'), a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90; e.style.setProperty('--x', Math.cos(a) * d + 'px'); e.style.setProperty('--y', Math.sin(a) * d - 30 + 'px'); b.appendChild(e); }
  c.appendChild(b); setTimeout(() => b.remove(), 900);
}
function submit(a) {
  const t = cur; if (!t || t.done) return;
  if (G.check(t, a)) {
    t.done = true; const res = t.att === 0 ? 'ok' : 'meh'; S.res[S.i] = res;
    sfx.ok(); burst();
    if (t.tuka) say('oops', 'Ups! Danke, Chefin. Du hast meinen Fehler gefunden.', true);
    else say('happy', res === 'ok' ? pickA(PRAISE) : 'Im zweiten Versuch geschafft. Dafür sind Hinweise da.', true);
    inp.solve && inp.solve(true);
    showFb(true, res === 'ok' ? pickA(['Richtig!', 'Stimmt!', 'Genau!']) : 'Geschafft!');
    return;
  }
  t.att++; S.errs++; S.topics[t.topic] = (S.topics[t.topic] || 0) + 1;
  if (t.att === 1) {
    sfx.hint();
    let d = null; try { d = t.diag ? t.diag(a) : null; } catch (e) { d = null; }
    say('think', '<b>Hinweis:</b> ' + esc(d || t.hint).replace(/&lt;(\/?b)&gt;/g, '<$1>'), true);
    inp.retry && inp.retry(a);
    return;
  }
  t.done = true; S.res[S.i] = 'miss'; if (!t.repeat) S.rep.push(t);
  say('oops', t.repeat ? 'Kein Drama. Schau dir den Weg in Ruhe an.' : 'Kein Drama. Schau dir den Weg an. Am Ende kommt so eine nochmal.');
  inp.solve && inp.solve(false);
  showFb(false, 'So geht es:');
}
function addSkip(el) {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'btn ghost skip'; b.textContent = 'Überspringen';
  b.addEventListener('click', skipTask);
  const act = el.querySelector('.act');
  if (act) act.appendChild(b); else { const d = document.createElement('div'); d.className = 'act'; d.appendChild(b); el.appendChild(d); }
}
function skipTask() {
  const t = cur; if (!t || t.done) return;
  t.done = true; t.skipped = true; S.res[S.i] = 'miss'; S.skips++;
  S.topics[t.topic] = (S.topics[t.topic] || 0) + 1;
  if (!t.repeat) S.rep.push(t);
  sfx.tap();
  say('happy', t.repeat ? 'Kein Problem. So geht\'s:' : 'Kein Problem. Am Ende kommt so eine nochmal. So geht\'s:');
  inp.solve && inp.solve(false);
  showFb(false, 'Der Weg:');
}
function showFb(ok, head) {
  const t = cur, fb = $('#fb');
  fb.innerHTML = '<div class="sol' + (ok ? '' : ' re') + '"><b>' + head + '</b><br>' + t.explain + '</div>' + (t.solFig ? '<div class="fig">' + renderFig(t.solFig) + '</div>' : '') + '<button class="btn green next" id="nx">' + (S.i + 1 >= S.tasks.length && !(S.rep.length && !S.repStarted) ? 'Station abschließen' : 'Weiter') + '</button>';
  const ip = $('#inp'); if (ip) ip.classList.add('locked');
  animateHills(fb);
  $('#nx').addEventListener('click', () => { S.i++; showTask(); });
  $('#nx').focus({ preventScroll: true });
  if (matchMedia('(max-width: 899px)').matches || !$('.padcol')) fb.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' });
}
function finish() {
  const st = S.st, main = S.tasks.filter(t => t.main), n = main.length;
  const ok = S.res.slice(0, n).filter(r => r === 'ok').length, meh = S.res.slice(0, n).filter(r => r === 'meh').length;
  const ratio = (ok + meh * 0.5) / n, starsN = ratio >= 0.85 ? 3 : ratio >= 0.6 ? 2 : 1;
  const rec = stRec(st.id), first = !rec.runs;
  rec.runs++; rec.stars = Math.max(rec.stars, starsN); rec.errors += S.errs; rec.skips = (rec.skips || 0) + S.skips; rec.last = new Date().toISOString().slice(0, 10);
  Object.keys(S.topics).forEach(k => { rec.topics[k] = (rec.topics[k] || 0) + S.topics[k]; });
  save(); sfx.done(); window.scrollTo(0, 0);
  const idx = STATIONS.indexOf(st), nextSt = st.final ? null : (STATIONS.slice(idx + 1).find(s => !stRec(s.id).runs) || STATIONS.find(s => !stRec(s.id).runs) || byId('final'));
  const effort = ok === n ? 'Alles im ersten Versuch. Du hast genau hingeschaut.' : 'Im ersten Versuch: ' + ok + ' von ' + n + '. Bei den anderen bist du drangeblieben.';
  let art;
  if (st.final) art = '<svg class="chest" id="chest" viewBox="0 0 160 130" aria-hidden="true"><g class="glow"><circle cx="80" cy="70" r="58" fill="#FFD23F" opacity=".35"/><path d="M80 10 v18 M30 30 l12 12 M130 30 l-12 12" stroke="#F28C28" stroke-width="5" stroke-linecap="round"/></g><rect x="30" y="74" width="100" height="48" rx="6" fill="#a8672f" stroke="' + INK + '" stroke-width="4"/><circle cx="60" cy="74" r="9" fill="#FFD23F" stroke="' + INK + '" stroke-width="2"/><circle cx="80" cy="70" r="10" fill="#FFD23F" stroke="' + INK + '" stroke-width="2"/><circle cx="100" cy="74" r="9" fill="#FFD23F" stroke="' + INK + '" stroke-width="2"/><path d="M50 74 v48 M110 74 v48" stroke="#FFD23F" stroke-width="5"/><g class="lid"><path d="M30 92 L30 76 Q30 50 80 50 Q130 50 130 76 L130 92 Z" fill="#c07a39" stroke="' + INK + '" stroke-width="4" transform="translate(0 -18)"/><rect x="72" y="62" width="16" height="16" rx="3" fill="#FFD23F" stroke="' + INK + '" stroke-width="3"/></g></svg>';
  else art = '<svg class="art" viewBox="0 0 48 48" aria-hidden="true">' + ICON[st.art] + '</svg>';
  app.innerHTML = '<div class="wrap">' + header('Geschafft') + '<div class="stage"><div class="talk">' + tukaSVG('happy') + '<div class="bubble"><b class="who">Tuka:</b> ' + (st.final ? 'Die Truhe ist offen! Du hast gerechnet. Ich hab gestaunt.' : (first ? 'Neu im Rucksack: ' + esc(st.artName) + '!' : 'Nochmal geschafft. Mit ganz neuen Aufgaben.')) + '</div></div>' +
    '<div class="card end">' + art + '<div class="bigstars" aria-label="' + starsN + ' von 3 Sternen">' + stars(starsN) + '</div><h3>' + (st.final ? 'Schatz gefunden' : esc(st.artName) + ' gefunden') + '</h3><p>' + effort + '</p>' +
    '<div class="act"><button class="btn green" id="again">Nochmal mit neuen Aufgaben</button>' + (nextSt && nextSt !== st ? '<button class="btn" id="nexts">Weiter: ' + esc(nextSt.short) + '</button>' : '') + '<button class="btn ghost" id="tomap">Zur Karte</button></div></div></div></div>';
  bindHeader();
  if (st.final) requestAnimationFrame(() => requestAnimationFrame(() => { const c = $('#chest'); if (c) c.classList.add('open'); }));
  $('#again').addEventListener('click', () => openStation(st.id));
  if ($('#nexts')) $('#nexts').addEventListener('click', () => openStation(nextSt.id));
  $('#tomap').addEventListener('click', showMap);
  S = null; cur = null;
}

/* ---------- Inputs ---------- */
const INPUTS = {};
function keypad(el, t, roman) {
  let v = '';
  const pre = t.pre ? '<span>' + esc(t.pre) + '</span>' : '', post = t.post ? '<span>' + esc(t.post) + '</span>' : '';
  const keys = roman ? ['I', 'V', 'X', 'L', 'C', 'D', 'M'].map(k => '<button class="r" data-k="' + k + '">' + k + '<small>' + fmt(({ I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 })[k]) + '</small></button>').join('') + '<button class="del" data-k="del">Löschen</button><button class="go" data-k="ok" style="grid-column:span 4">Prüfen</button>'
    : [1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => '<button data-k="' + k + '">' + k + '</button>').join('') + '<button class="del" data-k="del">Löschen</button><button data-k="0">0</button><button class="go" data-k="ok">Prüfen</button>';
  el.innerHTML = '<div class="disp">' + pre + '<div class="val empty' + (roman ? ' roman' : '') + '" id="val" role="status" aria-label="Deine Eingabe"></div>' + post + '</div><div class="keys' + (roman ? ' rom' : '') + '">' + keys + '</div><p class="second" id="second" hidden>Zweiter Versuch</p>';
  const val = $('#val', el);
  const show = () => { val.textContent = roman ? v : (v ? fmt(Number(v)) : ''); val.classList.toggle('empty', !v); };
  const press = k => {
    if (cur !== t || t.done) return;
    if (k === 'del') v = v.slice(0, -1);
    else if (k === 'ok') { if (v) submit(roman ? v : Number(v)); return; }
    else if (roman) { if (v.length < 15) v += k; }
    else { if (v === '0') v = ''; if (v.length < 13) v += k; }
    show();
  };
  el.querySelectorAll('.keys button').forEach(b => b.addEventListener('click', () => press(b.dataset.k)));
  const onKey = e => {
    if (!document.body.contains(el)) { document.removeEventListener('keydown', onKey); return; }
    if (e.target && e.target.tagName === 'INPUT') return;
    const k = e.key;
    if (!roman && /^[0-9]$/.test(k)) { press(k); e.preventDefault(); }
    else if (roman && /^[ivxlcdm]$/i.test(k)) { press(k.toUpperCase()); e.preventDefault(); }
    else if (k === 'Backspace') { press('del'); e.preventDefault(); }
    else if (k === 'Enter' && e.target.tagName !== 'BUTTON') { press('ok'); e.preventDefault(); }
  };
  document.addEventListener('keydown', onKey);
  return { retry: () => { v = ''; show(); $('#second', el).hidden = false; }, solve: ok => { if (ok) val.classList.add('right'); else (el.closest('.padcol') || el).style.display = 'none'; } };
}
INPUTS.num = (el, t) => keypad(el, t, false);
INPUTS.roman = (el, t) => keypad(el, t, true);
INPUTS.choice = (el, t) => {
  const cls = t.layout === 'row' ? 'opts row' : t.layout === 'roman' ? 'opts romanopts' : 'opts' + (t.options.length === 4 ? ' col2' : '');
  el.innerHTML = '<div class="' + cls + '" role="group">' + t.options.map((o, i) => '<button data-i="' + i + '">' + esc(o) + '</button>').join('') + '</div>';
  const bs = el.querySelectorAll('button');
  bs.forEach(b => b.addEventListener('click', () => submit(Number(b.dataset.i))));
  return { retry: a => { const b = bs[a]; if (b) { b.classList.add('tried'); b.disabled = true; } }, solve: () => { bs.forEach(b => b.disabled = true); bs[t.answer].classList.add('right'); } };
};
INPUTS.digits = (el, t) => {
  const s = t.digitsOf; let h = '<div class="digits" role="group">';
  for (let i = 0; i < s.length; i++) { if (s.length > 4 && i > 0 && (s.length - i) % 3 === 0) h += '<span class="sp"></span>'; h += '<button data-i="' + i + '" aria-label="Ziffer ' + s[i] + ' an Stelle ' + G.PL[s.length - 1 - i] + '">' + s[i] + '</button>'; }
  el.innerHTML = h + '</div>';
  const bs = el.querySelectorAll('button');
  bs.forEach(b => b.addEventListener('click', () => submit(Number(b.dataset.i))));
  return { retry: a => { const b = bs[a]; if (b) { b.classList.add('tried'); b.disabled = true; } }, solve: () => { bs.forEach(b => b.disabled = true); bs[t.answer].classList.add('right'); } };
};
INPUTS.multi = (el, t) => {
  const sel = new Set(), line = t.style === 'line';
  const cls = line ? 'linepts' : 'chips' + (t.style === 'words' ? ' words' : t.style === 'roman' ? ' romanchips' : '');
  el.innerHTML = '<div class="' + cls + '" role="group">' + t.items.map((o, i) => '<button data-i="' + i + '" aria-pressed="false">' + (line ? '<i></i>' : '') + esc(o) + '</button>').join('') + '</div><div class="act"><button class="btn" id="chk">Prüfen</button></div><p class="second" id="second" hidden>Zweiter Versuch. Du kannst die Auswahl ändern.</p>';
  const bs = el.querySelectorAll('[data-i]');
  bs.forEach(b => b.addEventListener('click', () => { if (t.done) return; const i = Number(b.dataset.i); sel.has(i) ? sel.delete(i) : sel.add(i); b.setAttribute('aria-pressed', sel.has(i)); sfx.tap(); }));
  $('#chk', el).addEventListener('click', () => submit(Array.from(sel).sort((a, b) => a - b)));
  return { retry: () => { $('#second', el).hidden = false; }, solve: () => { bs.forEach((b, i) => { b.disabled = true; b.setAttribute('aria-pressed', t.answer.includes(i)); if (t.answer.includes(i)) b.classList.add('must'); }); } };
};
function tileGame(el, t, opt) {
  // generic: tray of tiles -> ordered target row
  const tiles = opt.tiles, placed = [];
  el.innerHTML = (opt.top || '') + '<div class="chain" id="row" aria-label="Deine Reihe"></div><div class="tray" id="tray">' + tiles.map((v, i) => '<button class="tile" data-i="' + i + '">' + esc(opt.label(v)) + '</button>').join('') + '</div><div class="act"><button class="btn" id="chk" disabled>Prüfen</button><button class="btn ghost" id="clr">Alles zurück</button></div><p class="second" id="second" hidden>Zweiter Versuch. Kärtchen in der Reihe antippen legt sie zurück.</p>';
  const row = $('#row', el), tray = el.querySelectorAll('#tray .tile'), chk = $('#chk', el);
  const draw = () => {
    row.innerHTML = placed.length ? placed.map((i, k) => (k && opt.sep ? '<span class="sep">' + esc(opt.sep) + '</span>' : '') + '<button class="tile" data-k="' + k + '">' + esc(opt.label(tiles[i])) + '</button>').join('') : '<span class="ph">' + opt.ph + '</span>';
    tray.forEach((b, i) => b.classList.toggle('used', placed.includes(i)));
    chk.disabled = placed.length !== tiles.length;
    row.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => { if (t.done) return; placed.splice(Number(b.dataset.k), 1); draw(); }));
  };
  tray.forEach(b => b.addEventListener('click', () => { if (t.done) return; const i = Number(b.dataset.i); if (!placed.includes(i)) { placed.push(i); sfx.tap(); draw(); } }));
  $('#clr', el).addEventListener('click', () => { if (t.done) return; placed.length = 0; draw(); });
  chk.addEventListener('click', () => submit(opt.value(placed.map(i => tiles[i]))));
  draw();
  return { retry: () => { $('#second', el).hidden = false; }, solve: ok => { if (!ok) { placed.length = 0; opt.solution().forEach(v => { const i = tiles.findIndex((x, j) => x === v && !placed.includes(j)); placed.push(i); }); } draw(); row.querySelectorAll('button').forEach(b => b.disabled = true); $('#tray', el).style.display = 'none'; } };
}
INPUTS.order = (el, t) => tileGame(el, t, { tiles: t.tiles, sep: t.sep, label: fmt, ph: t.sep === '<' ? 'Kleinste Zahl zuerst' : 'Größte Zahl zuerst', value: a => a, solution: () => t.answer });
INPUTS.build = (el, t) => tileGame(el, t, { tiles: t.cards, sep: '', label: String, ph: 'Tippe die Kärtchen der Reihe nach an', value: a => a.join(''), solution: () => t.answer.split('').map(Number) });
INPUTS.place = (el, t) => {
  const d = t.slots.length, slot = Array(d).fill(null); let sel = null;
  let h = '<p class="hintline">Erst Kärtchen antippen, dann Spalte. Volle Spalte antippen legt es zurück.</p><div class="slotrow" style="grid-template-columns:repeat(' + d + ',1fr)">';
  t.slots.forEach((lab, k) => { const pi = d - 1 - k; h += '<div class="col' + (pi % 3 === 0 && pi > 0 ? ' g' : '') + '"><b>' + lab + '</b><button data-s="' + k + '" aria-label="Spalte ' + lab + '"></button></div>'; });
  h += '</div><div class="tray">' + t.cards.map((c, i) => '<button class="tile" data-c="' + i + '">' + c + '</button>').join('') + '</div><div class="act"><button class="btn" id="chk" disabled>Prüfen</button></div><p class="second" id="second" hidden>Zweiter Versuch. Du kannst umstecken.</p>';
  el.innerHTML = h;
  const sb = el.querySelectorAll('[data-s]'), cb = el.querySelectorAll('[data-c]'), chk = $('#chk', el);
  const draw = () => {
    sb.forEach((b, k) => { b.textContent = slot[k] == null ? '' : t.cards[slot[k]]; b.classList.toggle('full', slot[k] != null); });
    cb.forEach((b, i) => { b.classList.toggle('used', slot.includes(i)); b.classList.toggle('sel', sel === i); });
    chk.disabled = slot.includes(null);
  };
  cb.forEach(b => b.addEventListener('click', () => { if (t.done) return; const i = Number(b.dataset.c); sel = sel === i ? null : i; sfx.tap(); draw(); }));
  sb.forEach(b => b.addEventListener('click', () => {
    if (t.done) return; const k = Number(b.dataset.s);
    if (sel != null) { slot[k] = sel; sel = null; } else if (slot[k] != null) slot[k] = null;
    draw();
  }));
  chk.addEventListener('click', () => submit(slot.map(i => t.cards[i])));
  draw();
  return { retry: () => { $('#second', el).hidden = false; }, solve: ok => { if (!ok) { const used = []; t.answer.forEach((v, k) => { const i = t.cards.findIndex((c, j) => c === v && !used.includes(j)); used.push(i); slot[k] = i; }); } sel = null; draw(); el.querySelectorAll('button').forEach(b => b.disabled = true); } };
};
INPUTS.line = (el, t) => {
  const L = t.line; let v = null;
  const fig = $('#fig'); fig.innerHTML = lineSVG(L, { tap: true });
  const chev = d => '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + (d < 0 ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7') + '" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  el.innerHTML = '<p class="hintline">Tippe auf den Zahlenstrahl. Mit den Pfeilen schiebst du genau.</p><div class="nudge"><button class="btn ghost" data-d="-1" aria-label="Markierung nach links">' + chev(-1) + 'Links</button><button class="btn ghost" data-d="1" aria-label="Markierung nach rechts">Rechts' + chev(1) + '</button></div><div class="act"><button class="btn" id="chk" disabled>Prüfen</button></div><p class="second" id="second" hidden>Zweiter Versuch</p>';
  const svg = $('svg', fig), mk = $('.mk', svg), chk = $('#chk', el), sw = (LX1 - LX0) / L.n;
  const setV = val => {
    val = Math.max(0, Math.min(L.n * L.step, Math.round(val / L.snap) * L.snap)); v = val;
    const X = LX0 + (val / L.step) * sw;
    mk.innerHTML = '<circle cx="' + X + '" cy="54" r="10" fill="#1BA6A6" stroke="' + INK + '" stroke-width="2.5"/><path d="M' + X + ' 44 V22" stroke="#1BA6A6" stroke-width="4" stroke-linecap="round"/>';
    chk.disabled = false; sfx.tap();
  };
  svg.addEventListener('pointerdown', e => {
    if (t.done) return; const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 360;
    setV((x - LX0) / sw * L.step);
  });
  el.querySelectorAll('.nudge button').forEach(b => b.addEventListener('click', () => { if (t.done) return; setV((v == null ? 0 : v) + Number(b.dataset.d) * L.snap); }));
  chk.addEventListener('click', () => { if (v != null) submit(v); });
  return { retry: () => { $('#second', el).hidden = false; }, solve: () => { const keep = mk.innerHTML; fig.innerHTML = lineSVG(L, { correct: t.answer }); $('.mk', fig).innerHTML = keep; } };
};

/* ---------- Boot ---------- */
try { mapMQ = matchMedia('(min-width: 760px)'); const re = () => refreshMap(); mapMQ.addEventListener ? mapMQ.addEventListener('change', re) : mapMQ.addListener(re); } catch (e) {}
showMap();
})();
