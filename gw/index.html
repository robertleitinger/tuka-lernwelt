<style>
:root{
  --bg:#F6EBD5; --surface:#FFFBF1; --surface-2:#EFE0C1; --ink:#1C2B24; --ink-soft:#4A5A51;
  --green:#1F5E3B; --deep:#16452B; --leaf:#3FA34D; --orange:#F28C28; --teal:#1BA6A6; --sun:#FFC93C;
  --btn:#1F5E3B; --btn-ink:#FFFFFF; --line:rgba(28,43,36,.16); --track:#E7D3AC;
  --good-bg:#DDF1DD; --good-ink:#1D5E30; --hint-bg:#FFE9D1; --hint-ink:#8A4207; --bad:#D9521B; --bad-bg:#FBE1D5;
  --shadow:0 3px 0 rgba(28,43,36,.16);
  --sea:#CFE4E8; --ctx:#DDD7C9; --border:#FFFBF1;
  --c0:#CFE6B8; --c1:#F6D98B; --c2:#E8C7A6; --c3:#A9D8D3; --c4:#E3D2AE;
  --r-mitte:#F7D774; --r-west:#9ED8CF; --r-nord:#BFDDA6; --r-sued:#F5B183; --r-suedost:#DCC9A4; --r-ost:#A9C9E2;
  --f-disp:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-text:"Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13221B; --surface:#1B2E25; --surface-2:#243C30; --ink:#F4EDDC; --ink-soft:#BFCBBF;
  --green:#5BC46A; --deep:#0E1B15; --leaf:#5BC46A; --orange:#F5A04A; --teal:#41C7C7; --sun:#FFD25E;
  --btn:#2F8250; --btn-ink:#FFFFFF; --line:rgba(244,237,220,.16); --track:#2C4637;
  --good-bg:#1F4A2C; --good-ink:#C9F0CF; --hint-bg:#4A2E12; --hint-ink:#FFD7AE; --bad:#FF7A45; --bad-bg:#4A2416;
  --shadow:0 3px 0 rgba(0,0,0,.35);
  --sea:#102A30; --ctx:#27312C; --border:#13221B;
  --c0:#3F5F3A; --c1:#6E5F2C; --c2:#73492B; --c3:#2C5E59; --c4:#5A4E37;
  --r-mitte:#76632A; --r-west:#2A615A; --r-nord:#3F5C32; --r-sued:#76472B; --r-suedost:#5C5039; --r-ost:#2F4C63;
  color-scheme:dark;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--f-text);min-height:100vh}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* Navigation wie in den anderen Tuka-Apps */
nav.tl-nav{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;background:#16452B;color:#F6EBD5;box-shadow:0 2px 0 rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));min-height:52px;font-family:var(--f-disp)}
nav.tl-nav a.tl-home{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:4px 14px 4px 5px;border-radius:999px;background:#F6EBD5;color:#16452B;text-decoration:none;font-weight:600;font-size:16px;line-height:1;white-space:nowrap;flex:none;margin:4px 0}
nav.tl-nav a.tl-home:focus-visible{outline:3px solid #1BA6A6;outline-offset:2px}
nav.tl-nav a.tl-home img{width:34px;height:34px;border-radius:50%;display:block}
nav.tl-nav .tl-title{font-size:16px;font-weight:500;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
button.tl-music{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:4px 14px 4px 10px;border-radius:999px;border:2px solid rgba(246,235,213,.55);background:transparent;color:#F6EBD5;font:600 15px/1 var(--f-disp);cursor:pointer;flex:none;-webkit-tap-highlight-color:transparent}
button.tl-music.is-on{background:#F28C28;border-color:#F28C28;color:#1C2B24}
button.tl-music:focus-visible{outline:3px solid #1BA6A6;outline-offset:2px}
button.tl-music svg{display:block;flex:none}
@media (max-width:430px){nav.tl-nav .tl-title{display:none}}

.app{max-width:1080px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-left,0px)) 40px max(14px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
.muted{color:var(--ink-soft)}

/* Karte */
.mapbox{scroll-margin-top:62px;position:relative;border-radius:20px;overflow:hidden;background:var(--sea);border:2px solid var(--line);height:var(--maph,46vh);min-height:220px}
svg.map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
svg.map.noscroll-off{touch-action:manipulation}
svg.map .sea{fill:var(--sea)}
svg.map .ctx{fill:var(--ctx);stroke:var(--border);stroke-width:.8;vector-effect:non-scaling-stroke}
svg.map .c{stroke:var(--border);stroke-width:1.1;vector-effect:non-scaling-stroke;transition:fill .2s ease,opacity .2s ease}
svg.map .col0{fill:var(--c0)} svg.map .col1{fill:var(--c1)} svg.map .col2{fill:var(--c2)} svg.map .col3{fill:var(--c3)} svg.map .col4{fill:var(--c4)}
svg.map.byregion .c[data-r="mitte"]{fill:var(--r-mitte)} svg.map.byregion .c[data-r="west"]{fill:var(--r-west)}
svg.map.byregion .c[data-r="nord"]{fill:var(--r-nord)} svg.map.byregion .c[data-r="sued"]{fill:var(--r-sued)}
svg.map.byregion .c[data-r="suedost"]{fill:var(--r-suedost)} svg.map.byregion .c[data-r="ost"]{fill:var(--r-ost)}
svg.map.focus .c:not(.in){opacity:.42}
svg.map .c.hl{fill:var(--orange)!important;opacity:1!important;stroke:var(--ink);stroke-width:1.8}
svg.map .c.sel{fill:var(--orange)!important;opacity:1!important;stroke:var(--ink);stroke-width:1.8}
svg.map .c.ok{fill:var(--leaf)!important;opacity:1!important}
svg.map .c.bad{fill:var(--bad)!important;opacity:1!important}
svg.map .c.pulse{animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{opacity:.35}}
svg.map .mk{stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke}
svg.map .mk.hl,svg.map .mk.sel{fill:var(--orange)!important;stroke-width:2.5}
svg.map .mk.ok{fill:var(--leaf)!important} svg.map .mk.bad{fill:var(--bad)!important}
svg.map .hit{fill:transparent}
svg.map .cap{fill:var(--ink);stroke:var(--surface);stroke-width:1.5;vector-effect:non-scaling-stroke}
svg.map .cap.big{fill:#C0392B}
svg.map text{font-family:var(--f-disp);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-linejoin:round;pointer-events:none}
svg.map text.capname{font-weight:500}
.zoombar{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoombar button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font:700 22px/1 var(--f-disp);display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.zoombar button svg{width:22px;height:22px}
.mapnote{position:absolute;left:8px;top:8px;z-index:2;background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--ink-soft);border:1px solid var(--line);pointer-events:none}

/* Startseite */
.hero{display:flex;gap:14px;align-items:center;margin:4px 0 14px}
.hero img{width:72px;height:72px;border-radius:20px;flex:none;box-shadow:0 5px 0 rgba(0,0,0,.14)}
.hero h1{font-size:clamp(26px,7vw,34px)}
.hero p{margin:4px 0 0;color:var(--ink-soft)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.bar{height:12px;border-radius:999px;background:var(--track);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--leaf);border-radius:999px;width:0;transition:width .4s ease}
.prog{display:grid;gap:8px;margin-bottom:16px}
.prog .big{font-family:var(--f-disp);font-size:22px;font-weight:600}
.sec{font-size:20px;margin:18px 2px 10px}
.regions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.rbtn{display:grid;gap:6px;text-align:left;min-height:64px;padding:10px 12px;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;-webkit-tap-highlight-color:transparent}
.rbtn b{font-family:var(--f-disp);font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px}
.rbtn .dot{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid var(--line)}
.rbtn small{color:var(--ink-soft);font-size:14px}
.rbtn .bar{height:7px}
.rbtn[aria-pressed="true"]{border-color:var(--orange);background:var(--hint-bg);box-shadow:0 3px 0 var(--orange)}
.rbtn.all{grid-column:1/-1}
.modes{display:grid;gap:12px}
.mode{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:20px;border:2px solid var(--line);background:var(--surface);box-shadow:0 5px 0 var(--line);cursor:pointer;min-height:76px;-webkit-tap-highlight-color:transparent;transition:transform .1s ease,box-shadow .1s ease}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.mode .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px}
.mode h3{font-size:19px}
.mode p{margin:2px 0 0;color:var(--ink-soft);font-size:15px}
.mode.wackel{border-color:var(--orange)}
.note{margin:18px 4px 0;font-size:14px;color:var(--ink-soft)}
button:focus-visible,.mode:focus-visible,.rbtn:focus-visible{outline:3px solid var(--teal);outline-offset:3px}

/* Entdecken */
.toprow{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.toprow h2{font-size:22px;flex:1;min-width:0}
.back{min-height:44px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font:600 15px var(--f-disp);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 2px 8px;margin:0 -2px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font:600 15px var(--f-disp);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.info{margin-top:12px}
.info .cname{font-size:28px}
.info .aka{color:var(--ink-soft);font-size:15px;margin-top:2px}
.info .capline{font-size:20px;margin-top:8px}
.info .capline b{font-family:var(--f-disp);font-weight:600;font-size:24px;color:var(--green)}
.tipbox{margin-top:10px;background:var(--hint-bg);color:var(--hint-ink);border-radius:14px;padding:10px 12px;font-size:16px}
.nbs{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px;color:var(--ink-soft)}
.nbs button{min-height:44px;padding:4px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface-2);font:600 14px var(--f-disp);cursor:pointer}
.list{margin-top:14px;display:grid;gap:6px}
.list button{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.list button span:first-child{font-weight:700}
.list button span:last-child{color:var(--green);font-family:var(--f-disp);font-weight:600;text-align:right}
.list button.on{border-color:var(--orange);background:var(--hint-bg)}
.list .ok-mark{color:var(--leaf)}

/* Quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qtop .bar{flex:1;height:10px}
.qtop .count{font:600 15px var(--f-disp);color:var(--ink-soft);white-space:nowrap}
.qtop .stars{font:600 16px var(--f-disp);white-space:nowrap}
.qcard{margin-top:12px;display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center}
.qcard img{width:52px;height:52px;border-radius:14px}
.qcard .qtext{font:600 21px/1.25 var(--f-disp)}
.qcard .qsub{font-size:15px;color:var(--ink-soft);margin-top:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opt{min-height:58px;padding:8px 10px;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font:600 18px/1.15 var(--f-disp);cursor:pointer;text-wrap:balance;-webkit-tap-highlight-color:transparent}
.opt:active{transform:translateY(2px)}
.opt.ok{background:var(--good-bg);border-color:var(--leaf);color:var(--good-ink)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.gone{visibility:hidden}
.opt:disabled{cursor:default}
.helpers{display:flex;gap:10px;margin-top:12px}
.helpers button{flex:1;min-height:46px;border-radius:14px;border:2px dashed var(--line);background:transparent;font:600 16px var(--f-disp);cursor:pointer;color:var(--ink-soft)}
.hintbox{margin-top:10px;background:var(--hint-bg);color:var(--hint-ink);border-radius:14px;padding:10px 12px;font-size:16px}
.fb{margin-top:12px;border-radius:18px;padding:12px 14px;display:grid;gap:10px}
.fb.good{background:var(--good-bg);color:var(--good-ink)}
.fb.soft{background:var(--hint-bg);color:var(--hint-ink)}
.fb .ft{font:600 20px/1.2 var(--f-disp)}
.fb .fx{font-size:16px}
.next{min-height:52px;border-radius:16px;border:0;background:var(--btn);color:var(--btn-ink);font:600 19px var(--f-disp);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.next:active{transform:translateY(2px)}
.write{display:flex;gap:8px;margin-top:12px}
.write input{flex:1;min-width:0;min-height:54px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:8px 14px;font:600 20px var(--f-disp);color:var(--ink)}
.write input:focus{outline:3px solid var(--teal);outline-offset:1px}
.write button{min-height:54px;padding:0 16px;border-radius:14px;border:0;background:var(--btn);color:var(--btn-ink);font:600 17px var(--f-disp);cursor:pointer}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

/* Ende */
.end{text-align:center;display:grid;gap:12px;justify-items:center;padding-top:10px}
.end img{width:110px;height:110px;border-radius:28px;animation:hop .6s ease 2}
@keyframes hop{50%{transform:translateY(-12px)}}
.end h2{font-size:30px}
.end .starrow{font-size:30px;letter-spacing:4px}
.end .again{width:100%;max-width:460px;text-align:left}
.end .btns{display:grid;gap:10px;width:100%;max-width:460px}
.ghost{min-height:50px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font:600 17px var(--f-disp);cursor:pointer}

@media (min-width:860px){
  .split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
  .split .mapbox{--maph:72vh!important;position:sticky;top:64px}
  .split .qcard,.split .info{margin-top:0}
  .regions{grid-template-columns:repeat(3,1fr)}
  .rbtn.all{grid-column:auto}
  .homegrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
  .homegrid .mapbox{--maph:60vh!important}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

}

function levelUp(id, kind, ok) {
  const l = lv(id);
  if (kind === 'm') { if (ok) { l.m = Math.min(3, l.m + 1); l.mm = Math.max(0, l.mm - 1); } else { l.m = Math.max(0, l.m - 1); l.mm = Math.min(3, l.mm + 1); } }
  else { if (ok) { l.c = Math.min(3, l.c + 1); l.mc = Math.max(0, l.mc - 1); } else { l.c = Math.max(0, l.c - 1); l.mc = Math.min(3, l.mc + 1); } }
  save();
}

function nextQuestion(round) {
  if (round.i >= round.q.length) { endScreen(round); return; }
  const qq = round.q[round.i];
  const c = BY[qq.id];
  const kind = (qq.type === 'mapFind' || qq.type === 'mapName') ? 'm' : 'c';
  let firstTry = true, answered = false, hintsUsed = 0, wrongTries = 0;

  const bar = h('i', { style: 'width:' + Math.round(round.done / round.total * 100) + '%' });
  const stars = h('span', { class: 'stars', 'aria-label': 'Sterne' }, '⭐ ' + round.first);
  const mapSlot = h('div');
  const qtext = h('div', { class: 'qtext' });
  const qsub = h('div', { class: 'qsub' });
  const answers = h('div');
  const hintBox = h('div', { class: 'hintbox', hidden: true });
  const fb = h('div', { class: 'fb', hidden: true });
  const helpers = h('div', { class: 'helpers' });
  const hintBtn = h('button', { type: 'button', onclick: () => doHint() }, '💡 Tipp');
  const skipBtn = h('button', { type: 'button', onclick: () => doSkip() }, 'Überspringen');
  if (!round.noHelp) helpers.append(hintBtn); helpers.append(skipBtn);

  screen(
    h('div', { class: 'qtop' },
      h('button', { type: 'button', class: 'back', onclick: () => { if (round.done === 0 || confirmLeave()) homeScreen(); } }, '✕', h('span', { style: 'position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)' }, 'Beenden')),
      h('span', { class: 'bar' }, bar), h('span', { class: 'count' }, (round.done + 1) + '/' + round.total), stars),
    h('div', { class: 'split' }, mapSlot,
      h('div', null, h('div', { class: 'qcard' }, h('img', { src: TUKA, alt: '' }), h('div', null, qtext, qsub)), answers, hintBox, fb, helpers))
  );

  const region = round.region;
  const focusIds = region === 'all' ? null : idsOf(region);
  const mapH = qq.type === 'mapFind' ? '54vh' : qq.type === 'write' ? '28vh' : '36vh';
  map.mount(mapSlot, { height: mapH, pan: true, onTap: (id, ctx) => onMapTap(id, ctx) });
  map.focus(focusIds);
  if ((qq.type === 'mapFind' || qq.type === 'mapName') && c.micro) {
    const around = MAP.countries[qq.id].nb.length ? MAP.countries[qq.id].nb : ['IT'];
    let b = [Infinity, Infinity, -Infinity, -Infinity];
    around.concat([qq.id]).forEach(n => { const q = MAP.countries[n].bb; b = [Math.min(b[0], q[0]), Math.min(b[1], q[1]), Math.max(b[2], q[2]), Math.max(b[3], q[3])]; });
    map.view(b, 0.1, false);
  }
  else if (qq.type === 'mapFind' || qq.type === 'mapName') map.viewRegion(region === 'all' ? c.region : region, false);
  else map.viewCountry(qq.id, false);

  function finish(ok, msgTitle, msgText, noCount) {
    if (answered) return; answered = true;
    const counted = ok && firstTry && hintsUsed === 0 && !noCount;
    if (ok && !counted && !noCount) msgTitle = pick(['Jetzt stimmt es!', 'Jetzt hast du es!', 'Genau, so ist es!']);
    hintBox.hidden = true;
    levelUp(qq.id, kind, counted);
    if (counted) { round.first++; }
    else if (!round.missed.includes(qq.id)) round.missed.push(qq.id);
    round.done++;
    bar.style.width = Math.round(round.done / round.total * 100) + '%';
    stars.textContent = '⭐ ' + round.first;
    helpers.hidden = true;
    fb.className = 'fb ' + (ok ? 'good' : 'soft');
    const nextBtn = h('button', { type: 'button', class: 'next', onclick: () => { round.i++; nextQuestion(round); } }, round.i + 1 >= round.q.length ? 'Fertig' : 'Weiter');
    rc(fb, h('div', { class: 'ft' }, msgTitle), msgText ? h('div', { class: 'fx' }, msgText) : null, nextBtn);
    fb.hidden = false;
    setTimeout(() => { try { nextBtn.focus({ preventScroll: true }); fb.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' }); } catch (e) {} }, 60);
  }
  function confirmLeave() { return true; }
  function revealOnMap() {
    map.clearLabels(); map.clearCaps(); map.mark(qq.id, 'ok');
    map.caps([qq.id], true); map.nameAndCap(qq.id);
  }
  function doSkip() {
    if (answered) return;
    firstTry = false;
    // Die Frage kommt spaeter nochmal
    if (!qq.again && round.mode !== 'test') {
      const again = makeQuestion(qq.type, qq.id); again.again = 1;
      round.q.splice(Math.min(round.q.length, round.i + 3), 0, again); round.total++;
    }
    answered = true; levelUp(qq.id, kind, false); if (!round.missed.includes(qq.id)) round.missed.push(qq.id);
    revealOnMap();
    helpers.hidden = true; hintBox.hidden = true;
    disableAnswers(true);
    fb.className = 'fb soft';
    rc(fb, h('div', { class: 'ft' }, 'Kein Problem!'), h('div', { class: 'fx' }, solutionText() + (qq.again || round.mode === 'test' ? '' : ' Die Frage kommt später nochmal.')),
      h('button', { type: 'button', class: 'next', onclick: () => { round.i++; nextQuestion(round); } }, 'Weiter'));
    fb.hidden = false;
  }
  function solutionText() { return 'Die Hauptstadt ' + von(c) + ' ist ' + c.cap + '.'; }
  function disableAnswers(markCorrect) {
    answers.querySelectorAll('button,input').forEach(b => { b.disabled = true; if (markCorrect && b.dataset.v === answerValue()) b.classList.add('ok'); });
  }
  function answerValue() { return qq.type === 'capMC' ? c.cap : (qq.type === 'countryMC' || qq.type === 'mapName') ? c.id : ''; }

  function optionButtons(values, labelOf, onPick) {
    const g = h('div', { class: 'opts' });
    shuffle(values).forEach(v => { const b = h('button', { type: 'button', class: 'opt', 'data-v': v, onclick: () => onPick(v, b) }, labelOf(v)); g.append(b); });
    rc(answers, g); return g;
  }

  // ----- Fragetypen -----
  let hintText = '';
  if (qq.type === 'capMC') {
    qtext.textContent = 'Was ist die Hauptstadt ' + von(c) + '?';
    if (c.aka) qsub.textContent = c.aka;
    map.mark(qq.id, 'hl');
    const opts = [c.cap, ...capDistractors(qq.id, 3)];
    optionButtons(opts, v => v, (v, b) => {
      if (answered) return;
      if (v === c.cap) { b.classList.add('ok'); disableAnswers(); revealOnMap(); finish(true, pick(PRAISE), c.tip ? '🦜 ' + c.tip : null); }
      else {
        firstTry = false; b.classList.add('bad'); b.disabled = true; wrongTries++;
        const other = CAP_TO[v];
        if (wrongTries >= 2) { disableAnswers(true); revealOnMap(); finish(false, pick(SOFT), solutionText() + (other ? ' ' + v + ' liegt ' + inn(BY[other]) + '.' : '')); }
        else { hintBox.hidden = false; hintBox.textContent = other ? v + ' ist die Hauptstadt ' + von(BY[other]) + '. Versuch es nochmal!' : 'Versuch es nochmal!'; }
      }
    });
    hintText = 'Die Hauptstadt beginnt mit „' + c.cap[0] + '“.';
  }
  else if (qq.type === 'countryMC') {
    qtext.textContent = 'Von welchem Land ist ' + c.cap + ' die Hauptstadt?';
    map.caps([qq.id], true);
    const opts = [qq.id, ...countryDistractors(qq.id, 3)];
    optionButtons(opts, v => BY[v].name, (v, b) => {
      if (answered) return;
      if (v === qq.id) { b.classList.add('ok'); disableAnswers(); revealOnMap(); finish(true, pick(PRAISE), c.tip ? '🦜 ' + c.tip : null); }
      else {
        firstTry = false; b.classList.add('bad'); b.disabled = true; wrongTries++;
        if (wrongTries >= 2) { disableAnswers(true); revealOnMap(); finish(false, pick(SOFT), solutionText() + ' Die Hauptstadt ' + von(BY[v]) + ' ist ' + BY[v].cap + '.'); }
        else { hintBox.hidden = false; hintBox.textContent = 'Die Hauptstadt ' + von(BY[v]) + ' ist ' + BY[v].cap + '. Versuch es nochmal!'; }
      }
    });
    hintText = 'Schau auf die Karte: Der rote Punkt zeigt, wo ' + c.cap + ' liegt.';
  }
  else if (qq.type === 'tuka') {
    const truth = Math.random() < 0.45;
    let said = c.cap;
    if (!truth) {
      const wrongs = c.wrong || [];
      said = (wrongs.length && Math.random() < 0.65) ? pick(wrongs) : pick(capDistractors(qq.id, 3));
    }
    qtext.textContent = 'Tuka sagt: Die Hauptstadt ' + von(c) + ' ist ' + said + '.';
    qsub.textContent = 'Stimmt das?';
    map.mark(qq.id, 'hl');
    const yn = h('div', { class: 'yn' });
    const yes = h('button', { type: 'button', class: 'opt' }, '👍 Stimmt'), no = h('button', { type: 'button', class: 'opt' }, '👎 Stimmt nicht');
    yn.append(yes, no); rc(answers, yn);
    const explain = () => {
      if (truth) return null;
      const other = CAP_TO[said];
      if (other) return said + ' ist die Hauptstadt ' + von(BY[other]) + '. Die Hauptstadt ' + von(c) + ' ist ' + c.cap + '.';
      return said + ' liegt zwar ' + inn(c) + ', ist aber nicht die Hauptstadt. Die Hauptstadt ist ' + c.cap + '.';
    };
    const answer = saysTrue => {
      if (answered) return;
      const ok = saysTrue === truth;
      (saysTrue ? yes : no).classList.add(ok ? 'ok' : 'bad'); yes.disabled = no.disabled = true; revealOnMap();
      if (ok) finish(true, truth ? pick(PRAISE) + ' Das stimmt.' : 'Erwischt! Tuka hat sich vertan.', truth ? (c.tip ? '🦜 ' + c.tip : null) : explain());
      else { firstTry = false; finish(false, truth ? 'Doch, das stimmt!' : 'Tuka hat dich reingelegt!', truth ? solutionText() : explain()); }
    };
    yes.addEventListener('click', () => answer(true)); no.addEventListener('click', () => answer(false));
    hintText = 'Die Hauptstadt ' + von(c) + ' beginnt mit „' + c.cap[0] + '“.';
  }
  else if (qq.type === 'mapFind') {
    qtext.textContent = 'Tippe auf ' + acc(c) + '.';
    qsub.textContent = c.micro ? 'Kleine Länder sind als Punkt eingezeichnet.' : 'Du kannst die Karte größer machen.';
    rc(answers);
    const nbs = MAP.countries[qq.id].nb;
    if (nbs.length) { const two = shuffle(nbs).slice(0, 2).map(n => nom(BY[n])); hintText = (two.length > 1 ? 'Zwei Nachbarländer: ' : 'Nachbarland: ') + two.join(' und ') + '.'; }
    else hintText = qq.id === 'IS' ? 'Es ist eine große Insel ganz im Nordwesten.' : qq.id === 'MT' ? 'Es ist eine kleine Insel südlich von Italien.' : qq.id === 'CY' ? 'Es ist eine Insel ganz im Osten des Mittelmeers.' : 'Schau genau hin.';
  }
  else if (qq.type === 'mapName') {
    qtext.textContent = 'Welches Land ist orange?';
    map.mark(qq.id, 'hl'); map.mark(qq.id, 'pulse');
    const opts = [qq.id, ...countryDistractors(qq.id, 3)];
    optionButtons(opts, v => BY[v].name, (v, b) => {
      if (answered) return;
      if (v === qq.id) { b.classList.add('ok'); disableAnswers(); map.unmark(qq.id, 'hl'); revealOnMap(); finish(true, pick(PRAISE), 'Hauptstadt: ' + c.cap + '.'); }
      else {
        firstTry = false; b.classList.add('bad'); b.disabled = true; wrongTries++;
        map.mark(v, 'bad'); map.label(v, BY[v].name, { px: 15 });
        setTimeout(() => map.unmark(v, 'bad'), 900);
        if (wrongTries >= 2) { disableAnswers(true); map.unmark(qq.id, 'hl'); revealOnMap(); finish(false, pick(SOFT), istDas(c) + '. ' + solutionText()); }
        else { hintBox.hidden = false; hintBox.textContent = cap1(nom(BY[v])) + (BY[v].pl ? ' liegen' : ' liegt') + ' woanders. Ich zeig es dir auf der Karte.'; }
      }
    });
    const nbs = MAP.countries[qq.id].nb;
    hintText = nbs.length ? 'Das Land grenzt an ' + acc(BY[pick(nbs)]) + '.' : 'Es ist eine Insel.';
  }
  else if (qq.type === 'write') {
    qtext.textContent = 'Schreib die Hauptstadt ' + von(c) + '.';
    if (c.aka) qsub.textContent = c.aka;
    map.mark(qq.id, 'hl');
    const inp = h('input', { type: 'text', autocomplete: 'off', autocorrect: 'off', autocapitalize: 'words', spellcheck: 'false', 'aria-label': 'Hauptstadt', enterkeyhint: 'done', placeholder: 'Hauptstadt …' });
    const go = h('button', { type: 'button' }, 'Prüfen');
    const form = h('form', { class: 'write', onsubmit: e => { e.preventDefault(); check(); } }, inp, go);
    go.addEventListener('click', check);
    rc(answers, form);
    let hintLevel = 0;
    hintText = null;
    function check() {
      if (answered) return;
      const v = inp.value.trim(); if (!v) { inp.focus(); return; }
      const res = judge(v, c);
      if (res === 'exact') { inp.disabled = go.disabled = true; revealOnMap(); finish(true, pick(PRAISE), c.tip ? '🦜 ' + c.tip : null); }
      else if (res === 'close') { inp.disabled = go.disabled = true; revealOnMap(); finish(true, 'Fast richtig!', 'So schreibt man es: ' + c.cap + '. Schreib es dir nochmal genau an.', true); }
      else {
        firstTry = false; wrongTries++;
        const other = Object.keys(CAP_TO).find(k => norm(k) === norm(v));
        if (wrongTries >= 2) { inp.disabled = go.disabled = true; revealOnMap(); finish(false, pick(SOFT), 'Richtig ist: ' + c.cap + '.' + (other ? ' ' + other + ' ist die Hauptstadt ' + von(BY[CAP_TO[other]]) + '.' : '')); }
        else { hintBox.hidden = false; hintBox.textContent = (other ? other + ' ist die Hauptstadt ' + von(BY[CAP_TO[other]]) + '. ' : 'Das stimmt noch nicht. ') + 'Versuch es nochmal!'; inp.select(); }
      }
    }
    hintBtn.onclick = null;
    hintBtn.addEventListener('click', () => {
      if (answered) return;
      hintLevel++; hintsUsed++;
      const show = Math.min(c.cap.length - 1, hintLevel === 1 ? 1 : 3);
      hintBox.hidden = false;
      hintBox.textContent = 'So beginnt es: ' + [...c.cap].map((ch, i) => i < show ? ch : (ch === ' ' ? '  ' : '_')).join(' ');
      if (hintLevel >= 2) hintBtn.disabled = true;
    }, { once: false });
    setTimeout(() => { try { inp.focus({ preventScroll: true }); } catch (e) {} }, 120);
  }

  function doHint() {
    if (answered || qq.type === 'write') return;
    hintsUsed++; hintBox.hidden = false; hintBox.textContent = '💡 ' + hintText;
    if (qq.type === 'capMC' || qq.type === 'countryMC' || qq.type === 'mapName') {
      // zusaetzlich zwei falsche Antworten ausblenden
      const wrong = [...answers.querySelectorAll('.opt')].filter(b => b.dataset.v !== answerValue() && !b.disabled);
      shuffle(wrong).slice(0, Math.max(0, wrong.length - 1)).forEach(b => b.classList.add('gone'));
    }
    hintBtn.disabled = true;
  }

  function onMapTap(id, ctx) {
    if (qq.type !== 'mapFind' || answered) return;
    if (!id) {
      if (ctx) { const cc = MAP.context.find(x => x.ne === ctx); hintBox.hidden = false; hintBox.textContent = (cc && cc.de ? cc.de + ': ' : '') + 'Das gehört nicht zu deinen Ländern. Such weiter!'; }
      return;
    }
    if (id === qq.id) {
      map.clearLabels(); revealOnMap();
      finish(true, pick(PRAISE), istDas(c) + '. Hauptstadt: ' + c.cap + '.');
    } else {
      firstTry = false; wrongTries++;
      map.mark(id, 'bad'); const lab = map.label(id, BY[id].name, { px: 16 });
      setTimeout(() => { map.unmark(id, 'bad'); }, 1100);
      setTimeout(() => { try { lab.remove(); } catch (e) {} }, 1800);
      if (wrongTries >= 3) {
        map.mark(qq.id, 'hl'); map.mark(qq.id, 'pulse'); map.viewCountry(qq.id, true);
        setTimeout(() => { map.unmark(qq.id, 'hl'); revealOnMap(); }, 1500);
        finish(false, pick(SOFT), istDas(c) + '. Schau dir die Nachbarn gut an. ' + solutionText());
      } else {
        hintBox.hidden = false;
        hintBox.textContent = istDas(BY[id]) + '. ' + (wrongTries === 2 && !round.noHelp ? '💡 ' + hintText : 'Versuch es nochmal!');
      }
    }
  }
}

/* Schreibweise pruefen: Umlaute, Akzente, Gross/Klein und Leerzeichen sind egal; ein kleiner Tippfehler gilt als "fast richtig" */
function norm(t) {
  return t.toLowerCase().replace(/ß/g, 'ss').replace(/ø/g, 'o').replace(/æ/g, 'ae').replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue')
    .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z]/g, '');
}
function norm2(t) { return norm(t).replace(/ae/g, 'a').replace(/oe/g, 'o').replace(/ue/g, 'u'); }
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
function judge(v, c) {
  const forms = [c.cap, ...(c.alt || [])];
  const x = norm(v), x2 = norm2(v);
  if (forms.some(f => norm(f) === x || norm2(f) === x2)) return 'exact';
  // keine andere Hauptstadt als "fast richtig" werten
  if (Object.keys(CAP_TO).some(k => k !== c.cap && norm(k) === x)) return 'wrong';
  const best = Math.min(...forms.map(f => lev(norm2(f), x2)));
  const L = norm2(c.cap).length;
  if (best <= (L <= 5 ? 1 : 2)) return 'close';
  return 'wrong';
}

function endScreen(round) {
  const total = round.total, first = round.first;
  const share = first / total;
  const title = share >= 1 ? 'Alles richtig!' : share >= 0.9 ? 'Wow, fast alles!' : share >= 0.6 ? 'Geschafft, super!' : 'Geschafft!';
  const msg = round.mode === 'test'
    ? 'Du hast ' + first + ' von ' + total + ' Punkten.'
    : 'Du hast ' + first + ' von ' + total + ' Fragen gleich beim ersten Mal gewusst.';
  const starsN = share >= 0.9 ? 3 : share >= 0.6 ? 2 : 1;
  const again = round.missed.length ? h('div', { class: 'card again' },
    h('h3', { style: 'font-size:19px;margin-bottom:8px' }, 'Das übst du nochmal:'),
    h('div', { class: 'list', style: 'margin-top:0' }, ...round.missed.map(id => h('button', { type: 'button', onclick: () => exploreScreen(id) }, h('span', null, BY[id].name), h('span', null, BY[id].cap))))) : null;
  screen(h('div', { class: 'end' },
    h('img', { src: TUKA, alt: 'Tuka freut sich' }),
    h('h2', null, title),
    h('div', { class: 'starrow', 'aria-label': starsN + ' Sterne' }, '⭐'.repeat(starsN)),
    h('p', { style: 'margin:0;font-size:18px' }, msg),
    h('p', { class: 'muted', style: 'margin:0' }, round.missed.length ? 'Fehler sind Hinweise. Genau diese Länder kommen bald wieder.' : 'Du hast dich richtig angestrengt. Tuka ist stolz auf dich!'),
    again,
    h('div', { class: 'btns' },
      h('button', { type: 'button', class: 'next', onclick: () => startQuiz(round.mode === 'wackel' && !COUNTRIES.some(c => isWackel(c.id)) ? 'cap' : round.mode) }, 'Nochmal'),
      h('button', { type: 'button', class: 'ghost', onclick: homeScreen }, 'Zur Übersicht'))));
}

homeScreen();
</script>
